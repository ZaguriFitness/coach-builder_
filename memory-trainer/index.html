<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מאמן השליפה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Suez+One&display=swap">
<style>
/* Layout: one narrow phone column; sticky header, five-tab bottom bar, full-screen practice sessions. Indigo = the thing you're reaching for, amber = a cue on the way to it. */
:root{
  --bg:#F2F3F8; --surface:#FFFFFF; --sunk:#E9EBF3; --ink:#1A1E2D; --muted:#596079; --line:#D7DAE6;
  --accent:#3A49B8; --accent-ink:#FFFFFF; --accent-soft:#E2E5F9;
  --cue:#9A5B00; --cue-soft:#FAEED7;
  --good:#1E7349; --good-soft:#DCF0E4; --bad:#AE3636; --bad-soft:#F7E1E1;
  --display:"Suez One","Rubik",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --fs:17px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10121A; --surface:#191C27; --sunk:#141620; --ink:#E7E9F3; --muted:#9BA1B9; --line:#2B2F40;
  --accent:#8E9AFF; --accent-ink:#10121A; --accent-soft:#252A4A;
  --cue:#F0B558; --cue-soft:#372B16;
  --good:#62C994; --good-soft:#17332A; --bad:#F08C8C; --bad-soft:#3B1F23; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10121A; --surface:#191C27; --sunk:#141620; --ink:#E7E9F3; --muted:#9BA1B9; --line:#2B2F40;
  --accent:#8E9AFF; --accent-ink:#10121A; --accent-soft:#252A4A;
  --cue:#F0B558; --cue-soft:#372B16;
  --good:#62C994; --good-soft:#17332A; --bad:#F08C8C; --bad-soft:#3B1F23; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:1.6;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 10px}
header.top h1{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0;flex:1;letter-spacing:.01em}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:40px;min-width:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.9rem}
.sos{border-color:var(--cue);color:var(--cue);background:var(--cue-soft);font-weight:500}
.sync{font-size:.75rem;color:var(--muted)}

nav.tabs{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .row{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:500}

h2{font-family:var(--display);font-weight:400;font-size:1.25rem;margin:0;text-wrap:balance}
h3{font-size:1rem;margin:0;font-weight:700}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font-size:.75rem;letter-spacing:.06em;color:var(--muted);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;min-height:46px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.cue{background:var(--cue-soft);border-color:var(--cue);color:var(--cue)}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:grid;gap:8px}
.btns.two{grid-template-columns:1fr 1fr}
.btns.three{grid-template-columns:1fr 1fr 1fr}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.8rem;background:var(--surface);color:var(--muted)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.ex{border-style:dashed}
button.chip{min-height:34px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:.9rem;font-weight:500}
label.fld span.help{font-weight:400;color:var(--muted);font-size:.8rem}
input[type=text],input[type=date],input[type=search],textarea,select{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 12px;min-height:46px}
textarea{min-height:110px;resize:vertical;line-height:1.7}

/* Today */
.plan{counter-reset:step;display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--sunk)}
.step .n{width:30px;height:30px;border-radius:999px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.9rem;color:var(--muted)}
.step.done .n{background:var(--good);border-color:var(--good);color:var(--surface)}
.step .t{min-width:0}
.step .t small{display:block;color:var(--muted);font-size:.8rem;line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--sunk);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.8rem;color:var(--muted)}
.chart{width:100%;height:auto;display:block;color:var(--accent)}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}

/* Cards list */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:right;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item .emo{font-size:1.5rem;width:34px;text-align:center}
.item .txt{min-width:0}
.item .txt b{display:block;font-weight:500;overflow-wrap:anywhere}
.item .txt small{display:block;color:var(--muted);overflow-wrap:anywhere;line-height:1.4}
.boxdots{display:flex;gap:3px;direction:ltr}
.boxdots i{width:6px;height:14px;border-radius:2px;background:var(--line)}
.boxdots i.on{background:var(--accent)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}

/* Session (full screen practice) */
.session{display:flex;flex-direction:column;gap:16px;padding-top:4px}
.sesshead{display:flex;align-items:center;gap:10px}
.sesshead .grow{flex:1}
.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}
.prompt{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.prompt .big{font-size:1.6rem;font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.prompt .emoji{font-size:3.6rem;line-height:1}
.prompt .pic{font-size:6rem;line-height:1.1}
.timer{width:100%;height:4px;background:var(--sunk);border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--cue);transform-origin:right;animation:drain linear forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.cues{display:flex;flex-direction:column;gap:6px;width:100%}
.cueline{background:var(--cue-soft);color:var(--cue);border-radius:10px;padding:8px 12px;text-align:right;font-weight:500;overflow-wrap:anywhere}
.cueline small{display:block;font-weight:400;opacity:.85;font-size:.75rem}
.answer{background:var(--accent-soft);border-radius:14px;padding:14px;width:100%;text-align:center}
.answer b{font-size:1.4rem;display:block;overflow-wrap:anywhere}
.mask{letter-spacing:.18em;direction:rtl;font-variant-numeric:tabular-nums}
.note{font-size:.88rem;color:var(--muted);text-align:center}
.opts{display:grid;gap:8px;width:100%}
.opt{text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:50px;overflow-wrap:anywhere}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}

/* Fluency */
.clock{font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip.hint{background:var(--cue-soft);color:var(--cue);border-color:var(--cue)}
.chip.gap{border-style:dashed}
.why-list{margin:0;padding-inline-start:20px}
.tapcount{width:180px;height:180px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-size:3rem;font-weight:700;margin:0 auto}

/* RAN */
.grid-ran{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;direction:rtl;width:100%}
.grid-ran span{aspect-ratio:1;display:grid;place-items:center;font-size:1.45rem;font-weight:700;max-width:100%;background:var(--sunk);border-radius:8px}
.dot{width:70%;height:70%;border-radius:999px;border:2px solid var(--line)}

/* Reading */
.reading{font-size:calc(var(--fs) * 1.12);line-height:2;max-width:62ch;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere}

/* Tasks */
.task{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:22px;height:22px;margin-top:3px;accent-color:var(--accent);flex:none}
.check.done span{text-decoration:line-through;color:var(--muted)}
.phrase{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--sunk);border-radius:10px;padding:8px 12px}
.phrase span{min-width:0;overflow-wrap:anywhere}

/* Sheets and overlays */
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgb(10 12 20 / .45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sheet .head{display:flex;align-items:center;gap:8px}
.sheet .head h2{flex:1}
.breath{width:180px;height:180px;margin:10px auto;border-radius:999px;background:var(--accent-soft);border:2px solid var(--accent);display:grid;place-items:center;font-weight:500;color:var(--accent);transform:scale(.6)}
.breath.in{animation:bin 4s ease-in-out forwards}
.breath.out{animation:bout 6s ease-in-out forwards}
@keyframes bin{from{transform:scale(.6)}to{transform:scale(1)}}
@keyframes bout{from{transform:scale(1)}to{transform:scale(.6)}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;max-width:min(92%,480px);text-align:center}
.why ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.why li{line-height:1.55}
.tile{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;width:100%}
.tile b{font-size:1.05rem}
.tile small{grid-column:1/-1;color:var(--muted);line-height:1.45}
.tile .last{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
</style>

<div class="app" dir="rtl" lang="he">
  <header class="top">
    <h1>מאמן השליפה</h1>
    <span class="sync" id="sync">שמור במכשיר</span>
    <button class="iconbtn sos" data-a="sos" aria-label="נתקעתי – עצירה קצרה">נתקעתי</button>
    <button class="iconbtn" data-a="settings" aria-label="הגדרות ומידע">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
    </button>
  </header>
  <main id="view" class="stack"></main>
</div>

<nav class="tabs" dir="rtl" aria-label="ניווט ראשי"><div class="row" id="tabs"></div></nav>
<div id="overlay" dir="rtl"></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
'use strict';

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const z2 = n => String(n).padStart(2, '0');
const dstr = (d = new Date()) => d.getFullYear() + '-' + z2(d.getMonth() + 1) + '-' + z2(d.getDate());
const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); return dstr(new Date(y, m - 1, d + n)); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const isHeb = s => /[֐-׿]/.test(s);
const words = s => String(s || '').trim().split(/\s+/).filter(Boolean);
const heDate = s => { const [y, m, d] = s.split('-'); return d + '.' + m; };

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- storage: this device always, the person's private cloud space when the viewer offers it ---------- */
const LKEY = 'shlifa.v1';
const S = { items: {}, cloud: false };
try { const raw = localStorage.getItem(LKEY); if (raw) { const o = JSON.parse(raw); if (o && o.items) S.items = o.items; } } catch (e) {}
function saveLocal() { try { localStorage.setItem(LKEY, JSON.stringify({ items: S.items })); } catch (e) {} }

let remote = null, flushing = false, flushT = null;
const pending = new Set();
function put(o) { o.u = Date.now(); S.items[o.id] = o; saveLocal(); pending.add(o.id); clearTimeout(flushT); flushT = setTimeout(flush, 700); }
function remove(id) { put({ id, kind: 'gone' }); }
async function flush() {
  if (!remote || flushing) return;
  flushing = true;
  try {
    while (pending.size) {
      const id = pending.values().next().value; pending.delete(id);
      const o = S.items[id]; if (!o) continue;
      try { await remote.doc(id).set(o); }
      catch (e) {
        if (e && e.code === 'unavailable') { await sleep(400 + Math.random() * 600); try { await remote.doc(id).set(o); } catch (e2) { pending.add(id); break; } }
        else if (e && (e.code === 'revoked' || e.code === 'not_granted' || e.code === 'capability_disabled')) { remote = null; S.cloud = false; syncLabel(); break; }
        else if (e && e.code === 'quota_exceeded') { toast('נגמר המקום בשמירה בחשבון. הנתונים נשמרים במכשיר.'); break; }
      }
    }
  } finally { flushing = false; }
}
async function connect() {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const me = await user.id(); if (!me) return;
    const col = db.collection('data/users/' + me);
    const snap = await col.limit(1000).get();
    const seen = new Set();
    snap.docs.forEach(d => {
      const o = d.data(); if (!o) return; seen.add(d.id);
      const l = S.items[d.id];
      if (!l || (o.u || 0) > (l.u || 0)) S.items[d.id] = o;
      else if ((l.u || 0) > (o.u || 0)) pending.add(d.id);
    });
    Object.keys(S.items).forEach(k => { if (!seen.has(k)) pending.add(k); });
    remote = col; S.cloud = true; saveLocal(); syncLabel(); applyPrefs(); render(); flush();
  } catch (e) { /* stays device-only */ }
}
function syncLabel() { $('#sync').textContent = S.cloud ? 'נשמר בחשבון' : 'שמור במכשיר'; }

const all = kind => Object.values(S.items).filter(o => o.kind === kind);
const prefs = () => Object.assign({ fs: 17, rate: 0.9, think: 12 }, S.items.prefs || {});
function setPref(k, v) { const p = Object.assign({ id: 'prefs', kind: 'prefs' }, S.items.prefs || {}); p[k] = v; put(p); applyPrefs(); }
function applyPrefs() { document.documentElement.style.setProperty('--fs', prefs().fs + 'px'); }

/* daily log: one document of per-day counters */
function logDoc() { const o = S.items.log; return (o && o.kind === 'log') ? o : { id: 'log', kind: 'log', days: {} }; }
function today() { return logDoc().days[dstr()] || {}; }
function bump(fields) {
  const o = logDoc(); const d = dstr(); const day = o.days[d] || (o.days[d] = {});
  for (const k in fields) { const v = fields[k]; if (Array.isArray(v)) day[k] = (day[k] || []).concat(v); else day[k] = (day[k] || 0) + v; }
  put(o);
}
// active practice time: count gaps under 90s between interactions
let lastAct = 0, secBuf = 0, secT = null;
function activity() {
  const now = Date.now(); const gap = (now - lastAct) / 1000; lastAct = now;
  if (gap > 0 && gap < 90) { secBuf += gap; if (!secT) secT = setTimeout(() => { secT = null; const s = Math.round(secBuf); secBuf = 0; if (s > 0) bump({ sec: s }); }, 20000); }
}
document.addEventListener('pointerdown', activity, { passive: true });
document.addEventListener('keydown', activity, { passive: true });

/* ---------- speech ---------- */
function speak(text) {
  if (!('speechSynthesis' in window)) { toast('הקראה לא זמינה בדפדפן הזה'); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = isHeb(text) ? 'he-IL' : 'en-US'; u.rate = prefs().rate;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(u.lang.slice(0, 2)));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) { toast('הקראה לא זמינה כאן'); }
}
function hush() { try { speechSynthesis.cancel(); } catch (e) {} }

/* ---------- content ---------- */
const BOX_DAYS = [0, 1, 2, 4, 7, 14, 30, 60];
const STARTER = [
  { deck: 'פסיכולוגיה', front: 'אפקט הבדיקה', back: 'לשלוף מהזיכרון מחזק אותו יותר מקריאה חוזרת', hint: 'מבחן כשיטת למידה (testing effect)', link: 'זה בדיוק מה שהאפליקציה הזאת עושה', emoji: '🎯' },

function barChart(vals, labels) {
  const W = 300, H = 90, pad = 16, n = vals.length, max = Math.max(5, ...vals);
  const bw = (W - 8) / n;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H + pad}" role="img" aria-label="דקות אימון ב-${n} הימים האחרונים">`;
  s += `<line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--line)"/>`;
  vals.forEach((v, i) => {
    const x = W - (i + 1) * bw + 2; const h = v ? Math.max(2, v / max * (H - 14)) : 0;
    s += `<rect x="${x.toFixed(1)}" y="${(H - h).toFixed(1)}" width="${(bw - 4).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${i === n - 1 ? 'var(--accent)' : 'var(--accent-soft)'}" stroke="var(--accent)" stroke-width="${i === n - 1 ? 0 : 1}"/>`;
    if (i === 0 || i === n - 1 || i === Math.floor(n / 2)) s += `<text x="${(x + bw / 2 - 2).toFixed(1)}" y="${H + 12}" text-anchor="middle">${labels[i]}</text>`;
  });
  s += `<text x="${W}" y="10" text-anchor="end">${max} דק׳</text></svg>`;
  return s;
}
function lineChart(vals, label) {
  if (vals.length < 2) return `<p class="muted small">אחרי שני סבבים יופיע כאן גרף.</p>`;
  const W = 300, H = 90, max = Math.max(...vals) * 1.15, min = 0;
  const pts = vals.map((v, i) => [W - i / (vals.length - 1) * (W - 20) - 10, H - 8 - (v - min) / (max - min || 1) * (H - 24)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
    <line x1="0" x2="${W}" y1="${H - 8}" y2="${H - 8}" stroke="var(--line)"/>
    <path d="${d} L${last[0].toFixed(1)} ${H - 8} L${pts[0][0].toFixed(1)} ${H - 8}Z" fill="var(--accent-soft)" opacity=".7"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.5" fill="var(--accent)"/>
    <text x="${(last[0] + 8).toFixed(1)}" y="${(last[1] - 8).toFixed(1)}" text-anchor="start">${vals[vals.length - 1]}</text>
  </svg>`;
}

/* ---------- review session ---------- */
function startReview() {
  const q = dueCards().slice(0, 20).map(c => c.id);
  if (!q.length) { toast('אין כרטיסים לחזרה כרגע'); return; }
  openScreen('review', { q, i: 0, phase: 'think', cue: 0, again: [], res: { alone: 0, cued: 0, miss: 0 } });
  armThink();
}
function curCard() { const R = UI.screen; return S.items[R.q[R.i]]; }
function recogOptions(c) {
  const pool = shuffle(cards().filter(x => x.id !== c.id && x.back !== c.back));
  const same = pool.filter(x => (x.deck || 'כללי') === (c.deck || 'כללי'));
  const dis = [...new Set([...same, ...pool].map(x => x.back))].slice(0, 3);
  return dis.length < 3 ? null : shuffle([c.back, ...dis]);
}
function armThink() {
  const R = UI.screen; if (!R || R.type !== 'review') return;
  const c = curCard(); if (!c) return;
  if (R.opts) return;
  const secs = prefs().think;
  later(() => { if (UI.screen === R && R.phase === 'think' && R.cue === 0) { R.cue = 1; render(); } }, secs * 1000);
}
SCREENS.review = () => {
  const R = UI.screen; const c = curCard();
  if (!c) return reviewDone();
  if (R.opts === undefined) R.opts = (c.box || 0) === 0 && !R.again.includes(c.id) ? recogOptions(c) : null;
  const total = R.q.length; const pct = Math.round(R.i / total * 100);
  const ladder = cueLadder(c);
  let body = '';
  if (R.opts && R.phase === 'think') {
    body = `<p class="note">כרטיס חדש: קודם מזהים, אחר כך נשלוף בלי עזרה.</p><div class="opts">${R.opts.map((o, i) => `<button class="opt" data-a="pickOpt" data-v="${i}">${esc(o)}</button>`).join('')}</div>`;
  } else if (R.opts && R.phase === 'picked') {
    body = `<div class="opts">${R.opts.map((o, i) => `<div class="opt ${o === c.back ? 'right' : (i === R.picked ? 'wrong' : '')}">${esc(o)}</div>`).join('')}</div>
      ${R.ok ? '<p class="note">נכון.</p>' : '<p class="note">התשובה הנכונה מסומנת בירוק. תגיד אותה בקול פעם אחת.</p>'}
      <div class="btns two"><button class="btn" data-a="say" data-v="${esc(c.back)}">הקרא</button><button class="btn primary" data-a="next" autofocus>הבא</button></div>`;
  } else if (R.phase === 'think') {
    body = `
      ${R.cue === 0 ? `<div class="timer"><i style="animation-duration:${prefs().think}s"></i></div>` : ''}
      ${R.cue ? `<div class="cues">${ladder.slice(0, R.cue).map(([k, v]) => `<div class="cueline"><small>${esc(k)}</small><span class="${k.startsWith('אות') ? 'mask' : ''}">${esc(v)}</span></div>`).join('')}</div>` : ''}
      <div class="btns">
        <button class="btn primary" data-a="reveal" autofocus>נזכרתי, הצג תשובה</button>
        <div class="btns two">
          <button class="btn cue" data-a="moreCue" ${R.cue >= ladder.length ? 'disabled' : ''}>${R.cue ? 'עוד רמז' : 'רמז'}</button>
          <button class="btn ghost" data-a="blank">לא עולה לי</button>
        </div>
      </div>
      <p class="note">${R.cue ? 'רמז הוא חלק מהאימון, לא כישלון.' : 'תנסה להגיד את התשובה בקול לפני שאתה לוחץ.'}</p>`;
  } else if (R.phase === 'check') {
    body = `<div class="answer"><b>${esc(c.back)}</b>${c.link ? `<small class="muted">${esc(c.link)}</small>` : ''}</div>
      <button class="btn" data-a="say" data-v="${esc(c.back)}">הקרא את התשובה</button>
      ${R.cue ? `<div class="btns two"><button class="btn good" data-a="grade" data-v="cued">ידעתי עם רמז</button><button class="btn bad" data-a="grade" data-v="miss">טעיתי</button></div>`
        : `<div class="btns three"><button class="btn good" data-a="grade" data-v="alone">ידעתי</button><button class="btn cue" data-a="grade" data-v="cued">חלקית</button><button class="btn bad" data-a="grade" data-v="miss">טעיתי</button></div>`}`;
  } else if (R.phase === 'blank') {
    body = `<div class="answer"><b>${esc(c.back)}</b>${c.link ? `<small class="muted">${esc(c.link)}</small>` : ''}</div>
      <p class="note">זה בסדר. הניסיון לשלוף, ואחריו התשובה, מחזק את הזיכרון. תגיד את התשובה בקול פעמיים. הכרטיס יחזור בסוף הסבב.</p>
      <div class="btns two"><button class="btn" data-a="say" data-v="${esc(c.back)}">הקרא</button><button class="btn primary" data-a="grade" data-v="miss" autofocus>אמרתי, הבא</button></div>`;
  }
  return `<section class="session">
    <div class="sesshead"><button class="iconbtn" data-a="exit">סיום</button><div class="grow"><div class="progress"><i style="width:${pct}%"></i></div></div><span class="small muted">${R.i + 1} / ${total}</span></div>
    <div class="prompt">
      <span class="chip">${esc(c.deck || 'כללי')}</span>
      ${c.emoji ? `<span class="emoji" aria-hidden="true">${esc(c.emoji)}</span>` : ''}
      <span class="big">${esc(c.front)}</span>
      <button class="chip" data-a="say" data-v="${esc(c.front)}">הקרא שאלה</button>
    </div>
    ${body}
  </section>`;
};
function reviewDone() {
  const R = UI.screen; const r = R.res; const n = r.alone + r.cued + r.miss;
  return `<section class="session"><div class="prompt">

};

/* ---------- reading in chunks ---------- */
function chunkText(text) {
  const paras = text.replace(/\r/g, '').split(/\n\s*\n|\n(?=\s*[-•\d])/).map(s => s.trim()).filter(Boolean);
  const out = [];
  paras.forEach(p => {
    if (words(p).length <= 75) { out.push(p); return; }
    const sents = p.match(/[^.!?׃]+[.!?׃]*["״']?\s*/g) || [p];
    let cur = '';
    sents.forEach(s => { if (cur && words(cur + s).length > 60) { out.push(cur.trim()); cur = ''; } cur += s; });
    if (cur.trim()) out.push(cur.trim());
  });
  // fold tiny leftovers into their neighbour
  const merged = [];
  out.forEach(c => { if (merged.length && words(c).length < 12 && words(merged[merged.length - 1]).length < 70) merged[merged.length - 1] += '\n' + c; else merged.push(c); });
  return merged;
}
SCREENS.reading = () => {
  const r = S.items[UI.screen.id]; if (!r) return '<p>הקריאה לא נמצאה.</p>';

  if (r.phase !== 'recall') {
    const c = r.chunks[r.pos];
    return `<section class="session">${head}
      <p class="eyebrow">${esc(r.title)} · ${r.pos === 0 ? 'רק חלק אחד. אפשר לעצור אחריו.' : 'חלק ' + (r.pos + 1)}</p>
      <div class="reading">${esc(c.t)}</div>
      <div class="row"><button class="btn" data-a="say" data-v="${esc(c.t)}">הקרא לי</button><button class="btn ghost" data-a="hush">עצור הקראה</button></div>
      <form class="panel" data-form="chunkSum">
        <label class="fld">מה הרעיון כאן, במילים שלך?<span class="help">3 עד 8 מילים. לא צריך משפט מושלם.</span>
          <input type="text" id="chunkSum" name="s" value="${esc(c.s || '')}" maxlength="140" autocomplete="off"></label>
        <div class="btns two"><button class="btn ghost" type="button" data-a="chunkPrev" ${r.pos === 0 ? 'disabled' : ''}>הקודם</button><button class="btn primary">${r.pos === n - 1 ? 'לשליפה מהזיכרון' : 'הבא'}</button></div>
      </form>
    </section>`;
  }
  const shown = r.rev || {};
  return `<section class="session">${head}
    <div class="panel"><h3>עכשיו בלי להסתכל</h3><p class="muted small">לכל חלק, נסה להיזכר מה היה הרעיון. רק אחר כך לחץ כדי לראות מה כתבת.</p></div>
    <div class="list">${r.chunks.map((c, i) => `
      <div class="task"><div class="row"><b style="flex:1">חלק ${i + 1}</b>${shown[i] ? `<span class="chip ${shown[i] === 'y' ? 'on' : ''}">${shown[i] === 'y' ? 'נזכרתי' : 'עוד לא'}</span>` : ''}</div>
        <p class="muted small">מתחיל ב: «${esc(words(c.t).slice(0, 5).join(' '))} …»</p>
        ${shown[i] ? `<div class="answer"><b style="font-size:1.05rem">${esc(c.s || '(לא כתבת סיכום לחלק הזה)')}</b></div>`
          : `<div class="btns two"><button class="btn good" data-a="recallMark" data-v="${i}:y">נזכרתי</button><button class="btn" data-a="recallMark" data-v="${i}:n">לא עולה, הצג</button></div>`}
      </div>`).join('')}</div>
    <div class="btns"><button class="btn primary" data-a="readToCards">הפוך את הסיכומים לכרטיסים</button><button class="btn" data-a="readFinish">סיימתי</button></div>
  </section>`;
};

let breathT;
function sos() {
  sheet(`<div class="head"><h2>עצירה קצרה</h2><button class="iconbtn" data-a="closeSheet">סגור</button></div>
    <p>נתקעת. זה קורה, וזה לא אומר שלא למדת. המידע בדרך כלל שם, הדרך החוצה איטית. האבחונים שלך הראו את זה שוב ושוב: <b>זיהוי טוב משליפה.</b></p>
    <div class="breath" id="breath">שאיפה</div>
    <p class="note" id="breathNote">שלוש נשימות: 4 שניות פנימה, 6 החוצה.</p>
    <div class="panel"><h3>ואז אחד מאלה</h3>
      <ul class="why" style="margin:0;padding-inline-start:20px"><li>להסתכל על התשובה, להגיד אותה בקול ולהמשיך.</li><li>לכתוב מילה אחת שקשורה, אפילו רחוקה. היא תמשוך את השאר.</li><li>לעבור לחלק הבא ולחזור לזה בסוף.</li><li>מול אנשים: "שנייה, אני מסדר את המחשבה."</li></ul></div>
    <button class="btn primary" data-a="closeSheet">חזרה</button>`);
  let k = 0; const el = () => $('#breath');
  const cycle = () => {
    if (!el()) return;
    if (k >= 6) { el().className = 'breath'; el().textContent = 'יופי'; $('#breathNote').textContent = 'אפשר לחזור.'; return; }
    const inhale = k % 2 === 0; el().className = 'breath ' + (inhale ? 'in' : 'out'); el().textContent = inhale ? 'שאיפה' : 'נשיפה';
    k++; breathT = setTimeout(cycle, inhale ? 4000 : 6000);
  };
  cycle();
}

function whyHtml() {
  return `<section class="panel why">
    <h3>למה האפליקציה בנויה ככה</h3>
    <p class="small muted">מבוסס על האבחונים שלך מ-2005, 2010 ו-2017 ועל סיכומי הנוירולוג.</p>
    <ul>
      <li><b>שליפה היא הקושי המרכזי, והוא עקבי לאורך השנים.</b> שיום תמונות 61% ב-2005, שטף מילים לפי קטגוריה באחוזון 1 ב-2017. לכן יש אימון שליפה ישיר: שטף מילים ושיום עם רמזים.</li>
      <li><b>זיהוי טוב משליפה.</b> בכל שלושת האבחונים, כשהיו לך אפשרויות לבחירה הצלחת הרבה יותר. לכן כרטיס חדש מתחיל בבחירה מתוך ארבע, ורק אחר כך עובר לשליפה חופשית. הרמזים בנויים כסולם, מהרחוק לקרוב.</li>
      <li><b>חזרות עובדות אצלך.</b> ב-2010 עקומת הלמידה עם חזרות עלתה מעל הממוצע. לכן החזרה מרווחת: מחר, עוד יומיים, עוד ארבעה, עוד שבוע.</li>
      <li><b>טקסט ארוך ודחוס קשה לזכור</b> (זכירת סיפור 23% ו-11% ב-2010). לכן הקריאה מחולקת לחלקים קטנים, עם סיכום במילים שלך אחרי כל חלק. זו גם ההמלצה מ-2005.</li>
      <li><b>החוזקה שלך חזותית</b> (ביצועי 113, תפיסה חזותית באחוזון 100 ב-2017). לכן יש בכרטיסים מקום לסמל ולחיבור אישי, שנותנים לזיכרון עוד דרך להיכנס.</li>
      <li><b>שטף מילים מותאם אליך.</b> הרמה עולה כשקל לך ויורדת כשקשה, כדי שתתאמץ ותצליח. חיות, פירות וירקות, כלי תחבורה והאותיות ב, ג, ש הוצאו בכוונה: אלה הפריטים של מבחני האבחון, ואימון עליהם עלול לנפח תוצאות באבחון הבא. כדאי לספר לבודק שאתה מתאמן.</li>
      <li><b>הלולאה של בחינה עצמית ותסכול</b> שתיארת: זמן חשיבה קצוב, רמז אוטומטי, וכפתור "נתקעתי" שעוצר את הלולאה במקום להילחם בה.</li>
      <li><b>הוראות בעבודה:</b> כותבים מיד, שלב בכל שורה, ומנסחים במילים שלך. ככה לא צריך לשלוף אותן אחר כך.</li>
    </ul>
    <h3>מה האפליקציה לא עושה</h3>
    <p class="small">היא לא מחזירה תאים שנפגעו ולא מחליפה אבחון או טיפול. משחקי מוח כלליים משפרים בעיקר את המשחק עצמו. לכן רוב האימון כאן הוא על החומר האמיתי שלך. השיטות (תרגול שליפה, חזרה מרווחת, רמזים מדורגים, ניתוח מאפיינים) נבדקו במחקר. שווה להראות את הנתונים מכאן גם למי שיעשה לך את האבחון הקוגניטיבי.</p>
  </section>`;
}

/* ---------- actions ---------- */
const ACT = {
  tab: v => go(v),
  sos: () => sos(),
  settings: () => settings(),
  closeSheet: () => closeSheet(),
  closeBg: (v, el, e) => { if (e.target === el) closeSheet(); },
  say: v => speak(v),
  hush: () => hush(),
  exit: v => { const s = UI.screen; if (s && s.type === 'reading') { const r = S.items[s.id]; if (r) put(r); } go(v || (s && (s.type === 'review' ? 'cards' : s.type === 'reading' ? 'read' : 'gym')) || 'today'); },
  review: () => startReview(),
  starter: () => { STARTER.forEach(s => put(newCard(Object.assign({ ex: true }, s)))); toast('נוספו 8 כרטיסי דוגמה'); render(); },
  dropExamples: () => { cards().filter(c => c.ex).forEach(c => remove(c.id)); toast('כרטיסי הדוגמה נמחקו'); render(); },
  deckFilter: v => { UI.deckFilter = v; render(); },
  cardNew: () => cardForm({ deck: UI.deckFilter !== 'הכל' ? UI.deckFilter : 'כללי' }),
  cardEdit: v => cardForm(S.items[v]),
  cardDelAsk: v => { $('#delZone').innerHTML = `<div class="row"><span>למחוק את הכרטיס?</span><button type="button" class="btn bad" data-a="cardDel" data-v="${v}">כן, מחק</button><button type="button" class="btn ghost" data-a="closeSheet">ביטול</button></div>`; },
  cardDel: v => { remove(v); closeSheet(); toast('הכרטיס נמחק'); render(); },
  pickOpt: v => { const R = UI.screen; const c = curCard(); R.picked = +v; R.ok = R.opts[+v] === c.back; R.phase = 'picked';
    c.st = c.st || { seen: 0, alone: 0, cued: 0, miss: 0 }; c.st.seen++;
    if (R.ok) { c.box = Math.min(7, (c.box || 0) + 1); c.due = addDays(dstr(), BOX_DAYS[c.box]); c.st.cued++; R.res.cued++; bump({ rev: 1, cued: 1 }); }
    else { c.box = 0; c.due = addDays(dstr(), 1); c.st.miss++; R.res.miss++; bump({ rev: 1, miss: 1 }); if (!R.again.includes(c.id)) { R.again.push(c.id); R.q.push(c.id); } }
    put(c); render(); },
  next: () => nextCard(),
  reveal: () => { UI.screen.phase = 'check'; clearTimers(); render(); },
  moreCue: () => { UI.screen.cue++; clearTimers(); render(); },
  blank: () => { UI.screen.phase = 'blank'; clearTimers(); render(); speak(curCard().back); },
  grade: v => grade(v),
  fluStart: () => startFluency('train'),
  fluMine: () => startFluency('mine'),
  fluMeasure: () => startFluency('measure'),
  fluOther: () => { const F = UI.screen; startFluency(F.kind === 'measure' ? 'train' : F.kind); },
  fluAgain: () => { const F = UI.screen; startFluency(F.kind === 'measure' || F.custom ? 'train' : F.kind); },
  fluInput: v => { UI.screen.input = v; setPref('fluInput', v); render(); },
  fluGo: () => runFluency(),
  fluTap: () => { if (fluAdd(null)) { const b = $('#fluTap'); if (b) b.textContent = UI.screen.taps.length; } },
  fluStop: () => finishFluency(),
  fluAnalyze: () => fluAnalyze(),
  fluAiNext: () => { const a = UI.screen.ai; const subs = (a.missed || []).filter(Boolean); startFluency('train', { p: a.next, subs: subs.length ? subs : MINE_HINTS }); UI.screen.custom = true; render(); },
  mineDel: v => { const o = Object.assign({ id: 'flucats', kind: 'flucats' }, S.items.flucats || {}); o.list = mineCats().filter((_, i) => i !== +v); put(o); render(); },
  nameStart: () => startNaming(),
  nameGot: () => { const N = UI.screen; N.ms = Date.now() - N.t0; N.phase = 'check'; render(); },
  nameCue: () => { UI.screen.cue++; render(); },
  nameGive: () => { const N = UI.screen; N.phase = 'shown'; N.ms = null; render(); speak(N.q[N.i][1]); },
  nameMark: v => { const N = UI.screen; let k = v; if (v === 'ok') k = (N.ms || 99999) < 3000 ? 'fast' : 'slow';
    N.res.push({ k, ms: v === 'miss' ? null : N.ms }); bump({ nm: 1, nmOk: v === 'miss' ? 0 : 1 });
    N.i++; N.phase = 'look'; N.cue = 0; N.ms = null; N.t0 = Date.now(); render(); },
  ranStart: v => startRan(v),
  ranGo: () => { const A = UI.screen; A.phase = 'run'; A.t0 = Date.now(); render(); },
  ranStop: () => { const A = UI.screen; A.s = Math.round((Date.now() - A.t0) / 100) / 10;
    const prev = Object.values(logDoc().days).flatMap(d => d.ran || []).filter(x => x.set === A.set); A.prev = prev.length ? prev[prev.length - 1].s : null;
    bump({ ran: [{ set: A.set, s: A.s }] }); A.phase = 'done'; render(); },
  readOpen: v => openScreen('reading', { id: v }),

  exportData: () => { const data = JSON.stringify({ app: 'shlifa', v: 1, items: S.items });
    const ok = () => toast('הגיבוי הועתק. הדבק אותו בפתק או במייל לעצמך.');
    const fallback = () => { $('#importZone').innerHTML = `<textarea id="exportBox" readonly>${esc(data)}</textarea><p class="small muted">סמן הכל והעתק.</p>`; $('#exportBox').select(); };

  importShow: () => { $('#importZone').innerHTML = `<textarea id="importBox" placeholder="הדבק כאן את הגיבוי"></textarea><button class="btn primary" data-a="importDo">שחזר</button>`; },
  importDo: () => { try { const o = JSON.parse($('#importBox').value); if (!o.items) throw 0; let n = 0;

      saveLocal(); flush(); closeSheet(); render(); toast('שוחזרו ' + n + ' פריטים'); }
    catch (e) { toast('זה לא נראה כמו גיבוי של האפליקציה. בדוק שהעתקת את כל הטקסט.'); } }
};
function saveChunk(r) { const inp = $('#chunkSum'); if (inp && r.chunks[r.pos]) r.chunks[r.pos].s = inp.value.trim(); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a; if (!ACT[a]) return;
  if (a === 'stepToggle') { ACT[a](b.dataset.v, b, e); return; }
  if (a !== 'closeBg') e.preventDefault();
  if (a !== 'closeBg' && b.closest('.sheet-bg') && !['closeSheet', 'cardDelAsk', 'cardDel', 'exportData', 'importShow', 'importDo'].includes(a)) closeSheet();
  ACT[a](b.dataset.v, b, e);
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.in; if (!k) return;
  if (k === 'search') { UI.q = e.target.value; const pos = e.target.selectionStart; render(); const s = $('#cardSearch'); if (s) { s.focus(); s.setSelectionRange(pos, pos); } }
  if (k === 'fs') { $('#fsVal').textContent = e.target.value; setPref('fs', +e.target.value); }
  if (k === 'rate') { $('#rateVal').textContent = e.target.value; setPref('rate', +e.target.value); }
  if (k === 'think') setPref('think', +e.target.value);
});
document.addEventListener('submit', e => {
  const f = e.target; const k = f.dataset.form; if (!k) return; e.preventDefault();
  const d = Object.fromEntries(new FormData(f).entries());
  if (k === 'cardSave') {
    const id = f.dataset.v; const c = id ? S.items[id] : newCard({});
    Object.assign(c, { front: d.front.trim(), back: d.back.trim(), link: d.link.trim(), hint: d.hint.trim(), emoji: d.emoji.trim(), deck: d.deck.trim() || 'כללי', ex: false });
    put(c); closeSheet(); toast(id ? 'הכרטיס עודכן' : 'הכרטיס נשמר. הוא יופיע בחזרה של היום.'); render();
  }
  if (k === 'fluWord') {
    const F = UI.screen; const w = (d.w || '').trim(); const inp = $('#fluIn');
    if (w && fluAdd(w)) $('#fluWords').insertAdjacentHTML('beforeend', `<span class="chip">${esc(w)}</span>`);
    if (inp) { inp.value = ''; inp.focus(); }
  }
  if (k === 'mineAdd') {
    const o = Object.assign({ id: 'flucats', kind: 'flucats' }, S.items.flucats || {});
    const subs = (d.subs || '').split(/[,،]/).map(x => x.trim()).filter(Boolean);
    o.list = [...mineCats(), { p: d.p.trim(), subs }]; put(o); toast('הקטגוריה נוספה'); render();
  }
  if (k === 'readNew') {
    const text = d.text.slice(0, 60000); const parts = chunkText(text);
    if (!parts.length) { toast('לא נמצא טקסט'); return; }
    const r = { id: 'r' + rid(), kind: 'read', title: d.title.trim(), prior: d.prior.trim(), chunks: parts.map(t => ({ t, s: '' })), pos: 0, phase: 'read', done: false };
    put(r); openScreen('reading', { id: r.id });
  }
  if (k === 'chunkSum') {
    const r = S.items[UI.screen.id]; saveChunk(r); bump({ chunks: 1 });
    if (r.pos < r.chunks.length - 1) r.pos++; else r.phase = 'recall';
    put(r); render(); window.scrollTo(0, 0);
  }
  if (k === 'taskNew') {
    const steps = (d.steps || '').split('\n').map(s => s.trim()).filter(Boolean).map(t => ({ t, d: false }));
    put({ id: 't' + rid(), kind: 'task', title: d.title.trim(), steps, dl: d.dl || '', mine: d.mine.trim(), done: false });
    f.reset(); toast('המשימה נשמרה'); render();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#overlay').innerHTML) closeSheet(); });

applyPrefs(); syncLabel(); render();
connect();
})();
</script>
