<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>בונה תוכניות אימון</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="theme-color" content="#1E6B78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="תוכניות אימון">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&display=swap">
<style>
/* Layout: library of exercises (main) + the selected trainee's program (side column on desktop, bottom sheet on phone). Same palette as the calisthenics ladders app. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#18211F; --muted:#5B6866; --line:#D3DCDA;
  --accent:#1E6B78; --accent-soft:#D6E8EA; --chalk:#F7F9F9; --warn:#A8452E; --warn-soft:#F6E1DA;
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121817; --surface:#1B2321; --ink:#E7EEEC; --muted:#9AA8A5; --line:#2E3A38;
  --accent:#6FB8C4; --accent-soft:#1F3639; --chalk:#18201E; --warn:#E59A84; --warn-soft:#3A2420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121817; --surface:#1B2321; --ink:#E7EEEC; --muted:#9AA8A5; --line:#2E3A38;
  --accent:#6FB8C4; --accent-soft:#1F3639; --chalk:#18201E; --warn:#E59A84; --warn-soft:#3A2420; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px}
h1{font-family:var(--display);font-weight:400;font-size:1.7rem;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 14px}
.label{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.05em;margin:0 0 6px}

/* trainee strip */
.trainees{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tr{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;display:flex;gap:6px;align-items:center}
.tr small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.tr[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tr[aria-pressed="true"] small{color:var(--surface);opacity:.85}
.tr.new{border-style:dashed;color:var(--accent);background:transparent}

.layout{display:grid;gap:20px;align-items:start}
@media (min-width:980px){.layout{grid-template-columns:minmax(0,1fr) 410px}.layout.solo{grid-template-columns:minmax(0,1fr)}}

/* library */
.groups{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;border:1.5px solid var(--line);border-radius:12px;padding:4px;background:var(--surface);margin-bottom:14px}
.grp{border:0;border-radius:9px;background:transparent;color:var(--muted);padding:9px 4px;font-family:var(--display);font-size:1.02rem;line-height:1.2}
.grp small{display:block;font-family:var(--body);font-size:.75rem;font-variant-numeric:tabular-nums}
.grp[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
/* sub-categories always on one line: chips share the row and shrink, long names wrap inside their chip */
.chips{display:flex;flex-wrap:nowrap;gap:5px;margin-bottom:12px}
.chip{flex:1 1 auto;min-width:0;border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:5px 6px;font-size:clamp(.72rem,1.5vw,.9rem);line-height:1.2;text-align:center}
main{min-width:0}
/* narrow screens: same single line, swiped sideways (no scrollbar shown) */
@media (max-width:640px){.chips{overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;margin-inline:-4px;padding-inline:4px}.chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;white-space:nowrap;padding:5px 10px;scroll-snap-align:start}}
.chip small{display:block;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85em}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.filters{display:grid;gap:8px;margin-bottom:12px}
.fhead{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ftog{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-weight:700;font-size:.92rem}
.ftog small{background:var(--accent);color:var(--surface);border-radius:999px;padding:0 7px;font-size:.75rem;font-variant-numeric:tabular-nums}
.ftog small:empty{display:none}
.ftog i{font-style:normal;color:var(--accent);transform:rotate(90deg)}
.ftog[aria-expanded="true"] i{transform:none}
.factive{display:contents}
.factive .fchip,.factive .fchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.fbody{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.frow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:start}
.frow .ft{font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:.04em;padding-top:4px}
.frow .fch{display:flex;flex-wrap:wrap;gap:5px}
.fchip{border:1px solid var(--line);background:var(--chalk);border-radius:999px;padding:2px 10px;font-size:.8rem;line-height:1.5}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.search{display:flex;gap:8px}
.searchbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:8px;margin-block:-8px 6px}
.searchbar input{font-size:1rem;padding:11px 14px;background:var(--surface);border-color:var(--accent)}
.findbtn{justify-self:start}
body.adding .homeonly{display:none}
body.adding .bar{display:none!important}
body.adding #target{display:none}
.addbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.addbar small{display:block;color:var(--muted);font-size:.78rem;font-weight:700}
.addbar b{font-family:var(--display);font-weight:400;font-size:1.3rem}
body.adding .searchbar{top:calc(env(safe-area-inset-top,0px) + 68px)}
.docprev{display:block;width:100%;height:auto;border:1.5px solid var(--line);border-radius:10px;background:#fff;-webkit-touch-callout:default}
.picker{position:fixed;inset:0;z-index:45;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pkwrap{height:100%;display:flex;flex-direction:column;max-width:1000px;margin:0 auto}
.pkhead{padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px;border-bottom:1.5px solid var(--line);position:relative}
.pktop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pkfoot{padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-top:1.5px solid var(--line);display:flex}
.pkclose{font-weight:700}
.pksearch{margin:0}.pksearch input{border-color:var(--accent)}
.pkhead .chips{margin:0}
.pkbody{flex:1;min-height:0;overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.ttype{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ttbtn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--accent);background:var(--surface);border-radius:10px;padding:6px 12px}
.ttbtn small{color:var(--muted);font-size:.78rem;font-weight:700}
.ttbtn b{font-weight:700}
.ttbtn span{color:var(--accent)}
.plans{display:grid;gap:8px}
.plan{display:grid;gap:2px;text-align:right;border:1.5px solid var(--line);background:var(--chalk);border-radius:12px;padding:12px 14px}
.plan b{font-family:var(--display);font-weight:400;font-size:1.15rem}
.plan small{color:var(--muted)}
.plan.on{border-color:var(--accent);background:var(--accent-soft)}
.splits{display:flex;flex-wrap:wrap;gap:8px}
.splits .day{font-size:1.05rem;padding:8px 16px;font-weight:700;letter-spacing:.05em}
.primary:disabled{opacity:.45;cursor:default}
.splits .day.sel{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.cathead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 2px;padding-bottom:8px;border-bottom:1.5px solid var(--line)}
.cathead h2{font-size:1.5rem}
.catsearch{display:flex;gap:6px;flex:0 1 300px;min-width:0}
.catsearch input{flex:1;min-width:0;border:1.5px solid var(--accent);border-radius:10px;padding:8px 12px;background:var(--surface)}
@media (max-width:480px){.catsearch{flex:1 1 100%}}
.search input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--chalk)}
.ghost{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-size:.92rem;white-space:nowrap}
.ghost.accent{border-color:var(--accent);color:var(--accent);font-weight:700}
.target{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;font-size:.92rem;color:var(--muted)}
.target b{color:var(--ink)}
.subhead{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 8px}
.subhead h3{font-family:var(--display);font-weight:400;font-size:1.12rem;margin:0}
.subhead span{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
@media (min-width:640px){.list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ex{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:6px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:4px 4px 4px 10px;height:100%}
.ex.on{border-color:var(--accent);background:var(--accent-soft)}
.exb{all:unset;box-sizing:border-box;display:block;min-width:0;padding:7px 8px;border-radius:9px;cursor:pointer;text-align:right}
.exb:hover{background:var(--chalk)}
.ex.on .exb:hover{background:transparent}
.exb:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.exb .more{display:inline-block;font-size:.76rem;color:var(--accent);font-weight:700;margin-inline-start:2px}
.exn{font-weight:700;font-size:1.02rem;line-height:1.3}
.exe{font-size:.8rem;color:var(--muted);direction:ltr;text-align:right;unicode-bidi:plaintext}
.exc{display:block;font-size:.88rem;color:var(--muted);margin-top:2px}
.exl{display:block;line-height:1.3}
.exsep{color:var(--muted);font-weight:400;white-space:pre}
.exe.exi{display:inline;font-size:.9rem;font-weight:600;unicode-bidi:isolate}
.exm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.dots{display:inline-flex;gap:2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.lv{font-size:.76rem;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.tag{font-size:.76rem;border-radius:6px;padding:1px 7px;background:var(--chalk);border:1px solid var(--line);color:var(--muted)}
.tag.own{border-color:var(--accent);color:var(--accent)}
.plus{width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);background:transparent;display:grid;place-items:center;color:var(--accent);font-size:1.5rem;line-height:1;font-weight:700;padding:0}
.plus:hover{background:var(--accent-soft)}
.ex.on .plus{background:var(--accent);color:var(--surface);font-size:1.1rem}
.empty{color:var(--muted);text-align:center;padding:28px 12px;background:var(--surface);border:1.5px dashed var(--line);border-radius:12px}

/* program panel */
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-width:0}
@media (min-width:980px){.panel{position:sticky;top:max(12px,env(safe-area-inset-top,0px));max-height:calc(100vh - 24px)}.pclose{display:none}.bar{display:none!important}}
@media (max-width:979px){
  .panel{position:fixed;inset:0;z-index:40;border-radius:0;border:0;transform:translateY(102%);visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .panel.open{transform:none;visibility:visible}
  @media (prefers-reduced-motion:no-preference){.panel{transition:transform .22s ease,visibility .22s}}
}
.phead{padding:14px 16px 10px;border-bottom:1.5px solid var(--line);display:grid;gap:8px}
.ptop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pmeta{color:var(--muted);font-size:.88rem}
.pclose{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:6px 12px}
.ptools{display:flex;gap:6px;align-items:center}

.ptbtn{font-weight:700;background:var(--surface)}
.pnrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pdet{border:1.5px solid var(--line);border-radius:10px;padding:3px 10px;font-size:.88rem}
.days{display:flex;flex-wrap:wrap;gap:6px}
.day{flex:none;border:1.5px solid var(--line);background:var(--chalk);border-radius:9px;padding:5px 11px;font-size:.92rem}
.day small{color:var(--muted);font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.day[aria-pressed="true"] small{color:var(--surface)}
.day.add{border-style:dashed;background:transparent;color:var(--accent)}
.dayrow{display:flex;gap:8px;align-items:center}
.dayrow input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--chalk);font-weight:700}
.pbody{padding:12px 16px;overflow-y:auto;flex:1;min-height:0}
html{scrollbar-width:none}
html::-webkit-scrollbar{display:none;width:0}
.items{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.it{border:1.5px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;background:var(--chalk)}
.ith{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:start}
.itn{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:.95rem;font-variant-numeric:tabular-nums}
.itt b{display:block;line-height:1.3}
.x{border:0;background:transparent;color:var(--muted);font-size:1.3rem;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--warn)}
.fields{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.fields label{display:grid;gap:2px;font-size:.72rem;color:var(--muted);font-weight:700}
.fields input,.note{width:100%;min-width:0;border:1.5px solid var(--line);border-radius:8px;padding:5px 7px;background:var(--surface);font-size:.95rem;font-weight:400;color:var(--ink)}
.fields input{text-align:center;font-variant-numeric:tabular-nums}
.note{font-size:.9rem}
.itacts{display:flex;flex-wrap:wrap;gap:6px}
.mini{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 9px;font-size:.84rem}
.mini:disabled{opacity:.35;cursor:default}
.pfoot{padding:12px 16px;border-top:1.5px solid var(--line);display:flex;flex-wrap:wrap;gap:8px}
.primary{border:0;background:var(--accent);color:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700}
.danger{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;color:var(--warn)}
.danger.arm{background:var(--warn-soft);border-color:var(--warn);font-weight:700}
.pempty{color:var(--muted);text-align:center;padding:30px 10px;display:grid;gap:12px;justify-items:center}

/* bottom bar (phone) */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:var(--surface);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar .bt{min-width:0}
.bar .bt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .bt span{font-size:.85rem;opacity:.8}
.bar button{flex:none;border:0;border-radius:10px;padding:9px 16px;background:var(--surface);color:var(--ink);font-weight:700}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,20,18,.45);display:grid;place-items:center;padding:max(64px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.mbox{background:var(--surface);color:var(--ink);border-radius:14px;width:min(520px,100%);max-height:calc(100vh - 84px);overflow:auto;padding:18px;display:grid;gap:12px;border:1.5px solid var(--line)}
.mbox label{display:grid;gap:4px;font-size:.85rem;font-weight:700;color:var(--muted)}
.mbox input,.mbox select,.mbox textarea{border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--chalk);font-weight:400;color:var(--ink);width:100%;min-width:0}
.mbox textarea{min-height:90px;resize:vertical}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:480px){.g2{grid-template-columns:minmax(0,1fr)}}
.macts{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.18)}
@media (min-width:980px){.toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}}
.loading{color:var(--muted);font-size:.9rem}
.mbox.wide{width:min(660px,100%);padding:0;gap:0}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 18px 10px}
.dhead .exe{font-size:.9rem}
.dbody{padding:0 18px 16px;display:grid;gap:14px}
.dtags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.td{background:var(--chalk);border-radius:10px;overflow:hidden}
.tdcv{display:block;width:100%;touch-action:pan-y;cursor:grab}
.tdbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;font-size:.85rem;color:var(--muted)}
.tdplay{font:inherit;font-size:.85rem;padding:4px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.vidrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.vidrow a{color:var(--accent);font-weight:700;text-decoration:none}
.vidrow a:hover{text-decoration:underline}
.dsec h3{font-family:var(--display);font-weight:400;font-size:1.05rem;margin:0 0 6px}
.mus{display:flex;flex-wrap:wrap;gap:6px}
.mus span{border-radius:999px;padding:3px 11px;font-size:.88rem;border:1.5px solid var(--line)}
.mus span.p{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.howp{margin:0;line-height:1.6}
.cue{background:var(--accent-soft);border-radius:10px;padding:9px 12px;font-weight:600}
.steps{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.errs{margin:0;padding-inline-start:20px;display:grid;gap:3px;color:var(--ink)}
.errs li::marker{color:var(--warn)}
.rxbox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rxbox div{background:var(--chalk);border-radius:10px;padding:8px 10px;display:grid;gap:1px}
.rxbox b{font-family:var(--display);font-weight:400;font-size:1.15rem;font-variant-numeric:tabular-nums}
.rxbox small{color:var(--muted);font-size:.76rem;font-weight:700}
.alts{display:grid;gap:8px}
.altrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.altrow .ft{font-size:.78rem;font-weight:700;color:var(--muted);min-width:78px}
.alt{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 10px;font-size:.88rem}
.alt:hover{border-color:var(--accent)}
.dfoot{position:sticky;bottom:0;background:var(--surface);border-top:1.5px solid var(--line);padding:12px 18px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dfoot .tgt{font-size:.85rem;color:var(--muted)}
.dfoot .primary.on{background:var(--warn-soft);color:var(--warn);border:1.5px solid var(--warn)}
.gh{list-style:none;margin-top:6px}
.gh:first-child,.gall+.gh{margin-top:0}
.ghb{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--accent-soft);border-inline-start:5px solid var(--accent);border-radius:8px;padding:9px 12px}
.ghb:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ghn{font-family:var(--display);font-size:1.35rem;font-weight:700;color:var(--ink);line-height:1.2}
.ghm{font-size:.85rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.ghc{margin-inline-start:auto;font-size:1.3rem;color:var(--accent);line-height:1;transform:rotate(90deg)}
.gh.open .ghc{transform:none}
@media (prefers-reduced-motion:no-preference){.ghc{transition:transform .15s}}
.gall{list-style:none;display:flex;justify-content:space-between;gap:8px}
.gnone{list-style:none;color:var(--muted);font-size:.9rem;padding:2px 4px}
.gadd{list-style:none}
.gadd button{width:100%;border:0;background:var(--chalk);color:var(--accent);border-radius:10px;padding:8px 12px;font-weight:700;text-align:center}
.gadd button:hover{background:var(--accent-soft)}
.itt .exm{margin-top:3px}
.itlink{all:unset;cursor:pointer;font-weight:700;display:block;line-height:1.3}
.itlink:hover{color:var(--accent);text-decoration:underline}
.itlink:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.bkimp{display:inline-flex;align-items:center;cursor:pointer}

<script>
const ILLV = (()=>{
const GY=200;
const f=n=>Math.round(n*10)/10;
const add=(p,len,a)=>{a=a*Math.PI/180;return [p[0]+Math.cos(a)*len,p[1]+Math.sin(a)*len]};
const line=(pts,cls)=>`<polyline class="${cls}" points="${pts.map(q=>f(q[0])+","+f(q[1])).join(" ")}"/>`;
const ang=(a,b)=>Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;

// two-link IK. pref: [x,y] direction the middle joint should bend toward
function ik(a0,b0,la,lb,pref){
  const dx=b0[0]-a0[0], dy=b0[1]-a0[1], d=Math.hypot(dx,dy)||0.001;
  if(d>=la+lb-0.3){const ux=dx/d,uy=dy/d;return [[a0[0]+ux*la,a0[1]+uy*la],[a0[0]+ux*(la+lb),a0[1]+uy*(la+lb)]];}
  const ux=dx/d, uy=dy/d, along=(la*la-lb*lb+d*d)/(2*d), h=Math.sqrt(Math.max(0,la*la-along*along));
  const m=[a0[0]+ux*along,a0[1]+uy*along];
  const c1=[m[0]-uy*h,m[1]+ux*h], c2=[m[0]+uy*h,m[1]-ux*h];
  const s1=(c1[0]-m[0])*pref[0]+(c1[1]-m[1])*pref[1];
  return [s1>=0?c1:c2, b0];
}
// ---------- side view ----------
function sideJ(p){
  const H=p.H, t=p.t, S=add(H,50,t);
  const C=add(add(S,15,t),4*(p.face||1),t+90);
  const arm=(A,ua,fa,pref)=>{
    if(A) return ik(S,A,28,26,pref||[-1,0]);
    const E=add(S,28,ua); return [E,add(E,26,fa)];
  };
  const leg=(L,th,sh,pref)=>{
    if(L) return ik(H,L,37,36,pref||[1,0]);
    const K=add(H,37,th); return [K,add(K,36,sh)];
  };
  const J={H,S,C};
  [J.E,J.W]=arm(p.A,p.ua,p.fa,p.eb);
  [J.K,J.F]=leg(p.L,p.th,p.sh,p.kb);
  if(p.A2||p.ua2!=null) [J.E2,J.W2]=arm(p.A2,p.ua2,p.fa2,p.eb2||p.eb);
  if(p.L2||p.th2!=null) [J.K2,J.F2]=leg(p.L2,p.th2,p.sh2,p.kb2||p.kb);
  return J;
}
function pt(J,r){return typeof r==="string"?J[r]:r}
// ---------- front view ----------
function ik2(s,h,down,cx){
  const pref = down ? [0,1] : [s[0]<cx?-1:1, 0];
  return ik(s,h,28,26,pref)[0];
}
// ================= poses =================
const X=(...a)=>Object.assign({},...a.filter(Boolean));
const onC=(F,R,y)=>[F[0]+Math.sqrt(Math.max(0,R*R-(F[1]-y)**2)),y];
function tri(F,W,l1,l2){const dx=W[0]-F[0],dy=W[1]-F[1],d=Math.hypot(dx,dy);
  const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a)),m=[F[0]+dx*a/d,F[1]+dy*a/d];
  const c1=[m[0]+dy*h/d,m[1]-dx*h/d],c2=[m[0]-dy*h/d,m[1]+dx*h/d];return c1[1]<c2[1]?c1:c2;}
const box=(x,y,w,h)=>({k:"box",x,y,w,h});
const ring=(at,len)=>({k:"ring",at,len});
const bar=at=>({k:"bar",at});

// ---------- FRONT (bar / rings) ----------
const FP={
  hang:{v:"front",sy:52,straight:true}, active:{v:"front",sy:45,straight:true,mark:true},
  feetBox:{v:"front",sy:52,straight:true,legs:"box",box:true},
  top:{v:"front",sy:6,down:true}, c2b:{v:"front",sy:-8,grip:32,down:true},
  high:{v:"front",sy:-26}, support:{v:"front",sy:-50,grip:20,straight:true},
};
const R=o=>X(o,{eq:"rings"});
// one-arm / archer helpers (front)
const archTop=s=>({v:"front",sy:8,dx:22*s,hL:[-48*s,90],hR:[45*s,90],stL:s>0,stR:s<0,down:true,
  ...(s<0?{hL:[-45,90],hR:[48,90]}:{})});
const oneHang={v:"front",sy:54,straight:true,dx:-4,hL:[-10,90],hR:[24,152],stR:false};
const oneTop={v:"front",sy:8,dx:-4,hL:[-10,90],hR:[24,104],down:true};

// ---------- SIDE: push-ups ----------
function pushups(F,handY,drop,opt){opt=opt||{};
  const S1=onC(F,123,handY-54), hand=[S1[0]+(opt.hx||0),handY], S2=onC(F,123,handY-drop);
  const pr=[...(opt.pr||[])];
  if(opt.hbox) pr.push(box(hand[0]-20,handY+3.5,40));
  if(opt.fbox) pr.push(box(F[0]-20,F[1]+3.5,40));
  if(opt.ring) pr.push(ring("W",opt.rlen||55));
  if(opt.fring) pr.push(ring("F",55));
  const fr=S=>{const a=Math.atan2(S[1]-F[1],S[0]-F[0])*180/Math.PI;
    return X({H:add(F,73,a),t:a,L:F,A:hand,eb:[-0.4,-1],g:1,pr},opt.extra);};
  return [fr(S1),fr(S2)];
}
const PU=pushups([20,200],200,22);
const DECL=pushups([20,172],200,22,{fbox:true});
const INC_HI=pushups([20,200],145,18,{hbox:true});
const INC_LO=pushups([20,200],172,20,{hbox:true});
const PPL=(()=>{const F=[20,200],S1=onC(F,123,150),hand=[S1[0]-24,200],S2=onC(F,123,180);
  const fr=S=>{const a=Math.atan2(S[1]-F[1],S[0]-F[0])*180/Math.PI;return {H:add(F,73,a),t:a,L:F,A:hand,eb:[-0.4,-1],g:1};};
  return [fr(S1),fr(S2)];})();
const WALL=(()=>{const F=[20,200],S1=add(F,123,-68),hand=[S1[0]+50,S1[1]+4],wx=hand[0]+3;
  const fr=a=>({H:add(F,73,a),t:a,L:F,A:hand,eb:[0.2,1],g:1,pr:[{k:"wall",x:wx,y1:35}]});
  return [fr(-68),fr(-58)];})();

// ---------- SIDE: dips ----------
const DIPBAR={k:"hbar",y:110,x1:45,x2:140};
const dipTop=(pr,e)=>X({H:[86.3,105.2],t:-80,A:[95,110],L:[78,177],kb:[1,0],pr:[DIPBAR,...(pr||[])]},e);
const dipBot=(pr,e)=>X({H:[80,158],t:-62,A:[95,110],eb:[-1,-1],L:[62,214],kb:[1,0.3],pr:[DIPBAR,...(pr||[])]},e);
const ringTop=(pr,e)=>X({H:[86.3,105.2],t:-80,A:[95,110],L:[78,177],pr:[ring("W",60),...(pr||[])]},e);
const ringBot=(pr,e)=>X({H:[80,158],t:-62,A:[93,112],eb:[-1,-1],L:[62,214],kb:[1,0.3],pr:[ring("W",60),...(pr||[])]},e);
const sbTop={H:[90,108],t:-80,A:[98,110],L:[100,180],pr:[bar([98,110])]};
const sbBot={H:[84,152],t:-55,A:[98,110],eb:[-1,-1],L:[86,224],kb:[1,0.3],pr:[bar([98,110])]};

// ---------- SIDE: pike & handstand ----------
function pike(F,W,pr){const H=tri(F,W,73,104), t=Math.atan2(W[1]-H[1],W[0]-H[0])*180/Math.PI;
  const H2=[H[0]+14,H[1]+6], St=[W[0]-6,W[1]-30], t2=Math.atan2(St[1]-H2[1],St[0]-H2[0])*180/Math.PI;
  return [{H,t,A:W,L:F,g:1,pr:pr||[],face:-1},{H:H2,t:t2,A:W,eb:[-1,-0.4],L:F,g:1,pr:pr||[],face:-1}];}
const PIKE=pike([30,200],[130,200]);
const PIKE_EL=pike([28,165],[118,200],[box(8,168.5,40)]);
const PIKE_DEF=pike([28,165],[118,186],[box(8,168.5,40),box(108,189.5,20)]);
const HS=(W,e)=>X({H:[W[0],W[1]-104],t:90,A:W,L:[W[0],W[1]-177],g:1},e);
const HSB=(W,low,e)=>X({H:[W[0]+2,low-50],t:88,A:W,eb:[-1,0],L:[W[0]+3,low-123],g:1},e);
const WALLR={k:"wall",x:114,y1:10};
const HLINE=(W,a)=>{const S=add(W,54,a),H=add(S,50,a);return {H,t:a+180,A:W,L:add(H,73,a),g:1};};
const CUSH=box(84,193,26,10.5);
const PAR=(x,y)=>box(x-10,(y==null?186:y)+3.5,20);

// ---------- SIDE: standing / legs ----------
const STAND={H:[80,127],t:-90,L:[80,200],A:[83,131],g:1};
const SQUAT={H:[52,165],t:-62,L:[80,200],kb:[1,-0.3],ua:0,fa:0,g:1};
const POLE={k:"pole",x:130,y1:55,y2:200};
const LUNGE_B={H:[62,150],t:-90,L:[96,200],kb:[1,-0.2],L2:[22,199],kb2:[0.2,1],A:[64,154],g:1};
const SPLIT_T={H:[60,132],t:-90,L:[96,200],L2:[22,199],kb2:[0.2,1],A:[62,136],g:1};
const BENCH=box(2,163.5,40);
const PIS_T={H:[80,127],t:-90,L:[80,200],L2:[110,180],kb2:[1,0],ua:0,fa:0,g:1};
const PIS_B={H:[60,176],t:-55,L:[82,200],kb:[1,-0.6],ua:-5,fa:-5,g:1};
PIS_B.L2=add(PIS_B.H,73,-8);
const GB_D={H:[78,192],t:180,L:[120,200],kb:[0.2,-1],A:[96,199],eb:[0,-1],g:1};
const GB_U={H:[82,163],t:144.5,L:[120,200],kb:[0.2,-1],A:[92,199],eb:[0,-1],g:1};
const NORD=a=>{const K=[80,198],H=add(K,37,a),th=Math.atan2(K[1]-H[1],K[0]-H[0])*180/Math.PI;
  const S=add(H,50,a);return {H,t:a,th,sh:180,A:add(S,54,a+80),g:1,pr:[box(36,186,16,12)]};};
const CALF=(dy,e)=>X({H:[80,127-dy],t:-90,L:[80,200-dy],A:[83,131-dy],g:1,toe:dy>0},e);

// ---------- SIDE: core ----------
const FPL=(()=>{const F=[20,199],S=onC(F,123,172),a=Math.atan2(S[1]-F[1],S[0]-F[0])*180/Math.PI;
  return {H:add(F,73,a),t:a,L:F,A:[S[0]+26,199],eb:[0,1],g:1};})();
const KPL={H:[90,188],t:Math.atan2(172-188,137-90)*180/Math.PI,th:Math.atan2(199-188,55-90)*180/Math.PI,sh:-160,A:[163,199],eb:[0,1],g:1};
const LIE={H:[95,192],t:180,g:1};
const DBUG1=X(LIE,{A:[45,138],th:-90,sh:0});
const DBUG2=X(LIE,{A:[-4,182],A2:[45,138],L:[166,186],th2:-90,sh2:0});
const HOL=(t,la,e)=>X({H:[85,192],t,L:add([85,192],73,la),ua:t,fa:t,g:1},e);
const DF=(dir)=>{const S=[45,170],H=add(S,50,dir);return {H,t:dir+180,L:add(H,73,dir),A:[8,176],eb:[0.3,-1],g:1,pr:[box(0,176.5,72)]};};
const RC1=X(LIE,{th:-90,sh:0,A:[90,199],eb:[0,-1]});
const RC2={H:[100,182],t:165,th:-125,sh:-25,A:[92,199],eb:[0,-1],g:1};
const HANGB=[100,40];
const HG=(e)=>X({H:[90,142],t:-90,A:HANGB,pr:[bar(HANGB)]},e);
const CHAIR=(e)=>X({H:[80,145],t:-90,ua:90,fa:0,pr:[{k:"hbar",y:127,x1:72,x2:114},{k:"pole",x:70,y1:80,y2:200}],g:1},e);
const SIT=(e)=>X({H:[70,194],t:-88,L:[143,199],A:[66,199],g:1},e);
const LS=(e)=>X({H:[78,170],t:-88,A:[80,176],g:1,pr:[PAR(80,176)]},e);
const TUCKL=[102,150];

// ---------- SIDE: statics ----------
const BEAR={H:[85,148],t:-3.4,A:[135,199],L:[50,199],kb:[0.6,1],g:1};
const FLB=[110,40];
const FL=(legs,e)=>X({H:[50,92],t:0,face:-1,A:FLB,pr:[bar(FLB)]},legs,e);
const FLROW=(legs,e)=>X({H:[74,60],t:0,face:-1,A:FLB,eb:[0,1],pr:[bar(FLB)]},legs,e);
const LEG_FULL=H=>({L:add(H,73,180)});
const L_T={th:-45,sh:150}, L_AT={th:-90,sh:180};
const BLB=[100,45];
const BL=(legs,e)=>X({H:[95,72],t:0,A:BLB,pr:[bar(BLB)]},legs,e);
const BL_T={th:45,sh:210}, BL_AT={th:90,sh:180};
const INVT=(e)=>X({H:[108,44],t:94.6,A:[100,40],th:-120,sh:-20,pr:[bar([100,40])]},e);
const INV=(e)=>X({H:[108,44],t:94.6,A:[100,40],th:-90,sh:-90,pr:[bar([100,40])]},e);
const GER=(e)=>X({H:[119.4,137.8],t:-95,A:[100,40],th:95,sh:95,pr:[bar([100,40])]},e);
const PLW=[100,184];
const PLS=add(PLW,54,-70);
const PLAN=(t,legs)=>X({H:add(PLS,-50,t),t,A:PLW,g:1,pr:[PAR(100,184)]},legs);
const FLAG=(e)=>X({H:[91.7,122.9],t:-15,A:[165,62],A2:[165,140],eb2:[-1,0],L:add([91.7,122.9],73,175),g:1,pr:[{k:"pole",x:165,y1:25,y2:200}]},e);

// ---------- SIDE: rows ----------
function rowPair(base,len,legLen,R0,opt){opt=opt||{};let R=R0;
  const best=(d,near)=>{let bA=-150,bS=1e9;for(let a=-179;a<=-91;a+=0.5){const S=add(base,len,a);
      const e=Math.abs(Math.hypot(S[0]-R[0],S[1]-R[1])-d);
      const score=near==null? e*4 - S[1]*0.05 : e*4 + Math.abs(a-near)*0.6;
      if(score<bS){bS=score;bA=a;}}return bA;};
  // finish (like a real ring row): ring/bar just in front of the upper chest, elbow bent behind the body, forearm up to the ring
  // upper arm goes back-and-down behind the body, forearm comes forward-up to the ring in front of the chest
  const UA=a=>a+210, FA=a=>a+80;
  const handAt=a=>{const S=add(base,len,a),E=add(S,28,UA(a));return add(E,26,FA(a));};
  const chestA=()=>{let bA=-150,bE=1e9;for(let a=-179;a<=-91;a+=0.5){
      const w=handAt(a),e=Math.hypot(w[0]-R[0],w[1]-R[1]);if(e<bE){bE=e;bA=a;}}return bA;};
  const fr=(a,end)=>{const H=add(base,legLen,a);
    const o=end?{H,t:a,ua:UA(a),fa:FA(a),g:1,pr:[...(opt.pr||[])]}:{H,t:a,A:R,eb:[0,1],g:1,pr:[...(opt.pr||[])]};
    if(legLen===73) o.L=base; else {o.th=Math.atan2(base[1]-H[1],base[0]-H[0])*180/Math.PI;o.sh=90;}
    if(opt.ring) o.pr.push(ring("W",60)); else o.pr.push(bar(end?"W":R));
    return X(o,opt.extra);};
  const aF=chestA(); R=handAt(aF);            // the bar sits exactly where the hand is at the finish
  const a0=best(54);return [fr(a0),fr(aF,true)];
}
const ROW_UP=rowPair([150,200],123,73,[133,66]);
const ROW_BK=rowPair([135,163],87,37,[118,112],{extra:{}});
const ROW_ST=rowPair([165,200],123,73,[105,132]);
const ROW_FE=rowPair([170,165],123,73,[100,118],{pr:[box(150,168.5,40)]});
const RROW=(base,R,opt)=>rowPair(base,123,73,R,X(opt,{ring:true}));

// ---------- core with rings / misc ----------

function zshift(fr,dx,dy){

  for(const k of ["H","A","A2","L","L2"]) if(Array.isArray(o[k])) o[k]=zsh(o[k],dx,dy);
  o.pr=(fr.pr||[]).map(q=>{const r=Object.assign({},q);
    if(r.k==="box"){r.x+=dx;r.y+=dy;} else if(r.k==="wall"){r.x+=dx;r.y1+=dy;}
    else if(r.k==="pole"){r.x+=dx;r.y1+=dy;r.y2+=dy;} else if(r.k==="hbar"){r.x1+=dx;r.x2+=dx;r.y+=dy;}
    for(const k of ["at","from","to","via"]) if(Array.isArray(r[k])) r[k]=zsh(r[k],dx,dy);
    return r;});
  return o;
}

חוזרים אחורה לנקודת ההתחלה.", "90/90 Hip Switch": "יושבים על הרצפה עם שתי ברכיים כפופות ב-90 מעלות לצד אחד. מסובבים את הברכיים לצד השני בלי עזרת הידיים.", "World's Greatest Stretch": "יורדים ללאנג' ארוך. מורידים מרפק לרצפה ליד הרגל הקדמית, ופותחים את היד לתקרה בסיבוב.", "Hip Flexor Stretch": "בחצי כריעה, ברך אחת על הרצפה. מכווצים ישבן ודוחפים את האגן קדימה עד מתיחה בקדמת הירך. מחזיקים.", "Pigeon Stretch": "מקפלים רגל אחת קדימה ומותחים את השנייה ישרה לאחור. נשענים עם הגו קדימה ומחזיקים.", "Frog Stretch": "על ארבע עם ברכיים רחבות. שולחים את האגן אחורה עד מתיחה בירך הפנימית ומחזיקים.", "Deep Squat Hold": "יורדים לסקוואט עמוק עם עקבים על הרצפה. פותחים את הברכיים עם המרפקים ומחזיקים.", "Hip CARs": "עומדים על רגל אחת. מצייר עיגול גדול ואיטי עם הברך השנייה לכל הטווח, ומחליפים כיוון.", "Band Hamstring Stretch": "שוכבים על הגב עם גומייה סביב כף הרגל. מושכים את הרגל הישרה למעלה עד מתיחה ומחזיקים.", "Adductor Rock Back": "בעמידת שש עם רגל אחת ישרה לצד. שולחים את האגן אחורה עד מתיחה בירך הפנימית, וחוזרים.", "Couch Stretch": "כורעים כשהברך האחורית צמודה לקיר. מזקיפים את הגו עד מתיחה בקדמת הירך ומחזיקים.", "Cat-Cow": "בעמידת שש. מעגלים את הגב למעלה בנשיפה, ומקשתים אותו מטה בשאיפה.", "Thoracic Rotation": "שוכבים על הצד עם ברכיים כפופות וידיים צמודות קדימה. פותחים את היד העליונה לצד השני תוך סיבוב החזה, וחוזרים.", "Thread the Needle": "בעמידת שש. מעבירים יד אחת מתחת לגוף לצד השני תוך סיבוב, ופותחים אותה חזרה לתקרה.", "Foam Roller Thoracic Extension": "שוכבים עם רולר מתחת לשכמות וידיים מאחורי הראש. מקשתים את הגב העליון מעל הרולר וחוזרים.", "Band Shoulder Dislocate": "אוחזים בגומייה ברחבה עם ידיים ישרות. מעבירים אותה מעל הראש אל מאחורי הגוף וחזרה.", "Shoulder CARs": "עומדים זקוף. מציירים עיגול גדול ואיטי עם יד ישרה לכל הטווח, ומחליפים כיוון.", "Doorway Chest Stretch": "מניחים אמה על המשקוף בגובה הכתף. עושים צעד קדימה עד מתיחה בחזה ומחזיקים.", "Lat Stretch": "אוחזים בעמוד ביד אחת או בשתיים. נוטים לאחור עם האגן עד מתיחה בצד הגב ומחזיקים.", "Child's Pose": "כורעים ומורידים את הישבן לעקבים. מותחים את הידיים קדימה על הרצפה ומחזיקים.", "Ankle Dorsiflexion Rock": "כורעים עם כף רגל קדמית על הרצפה. מזיזים את הברך קדימה מעל האצבעות כשהעקב נשאר על הרצפה, וחוזרים.", "Calf Stretch": "נשענים על קיר עם רגל אחת אחורה ישרה. לוחצים את העקב לרצפה עד מתיחה בשוק ומחזיקים.", "Ankle CARs": "יושבים או עומדים עם רגל באוויר. מציירים עיגולים איטיים עם הקרסול לכל הטווח, לשני הכיוונים.", "Band Ankle Mobilization": "קושרים גומייה מאחור סביב הקרסול. כורעים ומזיזים את הברך קדימה כשהגומייה מושכת את הקרסול לאחור.", "Leg Swings": "אוחזים בקיר ומניפים רגל קדימה ואחורה, ואחר כך מצד לצד.", "Arm Circles": "עומדים עם ידיים ישרות לצדדים. מציירים עיגולים קטנים ומגדילים בהדרגה, לשני הכיוונים.", "Wrist Mobility": "על ארבע עם כפות ידיים על הרצפה. מנדנדים את הגוף קדימה, אחורה ולצדדים כדי להניע את פרקי הידיים.", "Neck Stretch": "מורידים אוזן לכתף והיד בצד השני נמשכת למטה. מחזיקים ומחליפים צד.", "Quad Stretch": "עומדים ואוחזים בקרסול. מושכים את העקב לישבן כשהברכיים צמודות ומחזיקים.", "Cobra Stretch": "שוכבים על הבטן עם ידיים מתחת לכתפיים. דוחפים את החזה למעלה כשהאגן נשאר על הרצפה ומחזיקים.", "Downward Dog": "מפלאנק גבוה, מרימים את האגן גבוה כך שהגוף יוצר V הפוך. דוחפים את העקבים לכיוון הרצפה ומחזיקים.", "Spiderman Lunge": "יורדים ללאנג' עמוק ומניחים את שתי הידיים מבפנים לרגל הקדמית. מחזיקים ומחליפים צד.", "Bodyweight Squat": "רגליים ברוחב כתפיים, אצבעות מעט החוצה. יורדים כאילו מתיישבים לאחור, עד הטווח הנוח, עם עקבים על הרצפה וגב ניטרלי. עולים חזרה.", "Box Squat": "עומדים מול ספסל או ארגז. יורדים לאט עד ישיבה קלה עליו, ועולים בלי להיעזר בידיים.", "Split Squat": "עומדים בפיסוק קדמי-אחורי קבוע. יורדים ישר למטה עד שהברך האחורית קרובה לרצפה ועולים, בלי להזיז את הרגליים.", "Reverse Lunge": "מעמידה פוסעים צעד ארוך לאחור ויורדים עד שהברך האחורית כמעט נוגעת ברצפה. דוחפים דרך העקב הקדמי וחוזרים לעמידה.", "Bulgarian Split Squat": "כף הרגל האחורית מונחת על ספסל מאחור. יורדים על הרגל הקדמית עד שהירך כמעט מקבילה לרצפה ועולים. הרגל האחורית רק לאיזון.", "Pistol Squat": "עומדים על רגל אחת, הרגל השנייה ישרה קדימה והידיים קדימה לאיזון. יורדים עד סקוואט מלא על הרגל העומדת ועולים בלי לגעת ברצפה ברגל השנייה.", "Shrimp Squat": "עומדים על רגל אחת, אוחזים ביד את כף הרגל השנייה מאחור. יורדים עד שהברך האחורית נוגעת ברצפה בשליטה, ועולים.", "Nordic Curl": "מכריעה עם קרסוליים מעוגנים, יורדים עד הרצפה ועולים חזרה בכוח ההמסטרינג בלבד, עם ירכיים פתוחות לכל אורך התנועה.", "Glute Bridge": "שוכבים על הגב, ברכיים כפופות וכפות רגליים על הרצפה. מרימים את האגן עד קו ישר מהברכיים לכתפיים, מכווצים ישבן, ויורדים.", "Single-Leg Glute Bridge": "גשר ישבן על רגל אחת, כשהרגל השנייה מורמת או ישרה. שומרים את האגן מאוזן בלי שייפול לצד.", "Standing Calf Raise": "עומדים זקוף, עולים על קצות האצבעות עד הגובה המרבי, מחזיקים שנייה ויורדים לאט.", "Single-Leg Calf Raise": "כמו הגרסה עם התמיכה, אבל עם אצבע אחת בלבד על הקיר לאיזון.", "Active Hang": "נתלים במוט עם ידיים ישרות. מורידים את השכמות למטה ומעט לאחור, כך שהכתפיים מתרחקות מהאוזניים, ומחזיקים את המנח בלי לכופף מרפקים.", "Scapular Pull-Up": "מתלייה מלאה ופסיבית, מושכים את השכמות למטה בלבד כך שהגוף עולה כמה סנטימטרים בלי לכופף מרפקים. מחזיקים שנייה ויורדים בשליטה חזרה לתלייה.", "Negative Pull-Up": "עולים לראש המוט בקפיצה או מארגז, כשהסנטר מעל המוט. יורדים לאט ובאופן אחיד עד תלייה מלאה עם ידיים ישרות, ואז חוזרים לנקודת ההתחלה.", "Pull-Up": "נתלים באחיזה עליונה מעט רחבה מהכתפיים. מורידים שכמות ומושכים עד שהסנטר עובר את המוט, ואז יורדים בשליטה עד ידיים ישרות לגמרי.", "Ring Pull-Up": "מתלייה פעילה מושכים עד שהטבעות ליד הכתפיים. כפות הידיים מסתובבות בחופשיות במהלך התנועה. יורדים בשליטה עד ידיים ישרות.", "Archer Pull-Up": "אוחזים במוט באחיזה רחבה מאוד. מושכים לכיוון יד אחת, כשהיד השנייה נשארת כמעט ישרה ורק מסייעת. יורדים בשליטה ומחליפים צד.", "Ring Row": "אוחזים בטבעות ונשענים לאחור עם גוף ישר. מושכים את החזה אל הידיים ומצמידים את השכמות. ככל שהגוף קרוב יותר לרצפה, כך התרגיל קשה יותר.", "Tuck Front Lever": "בתלייה בטבעות מושכים עם ידיים ישרות עד שהגב מקביל לרצפה, עם ברכיים לחזה. מחזיקים.", "Wall Push-Up": "עומדים מול קיר במרחק צעד וחצי, עם ידיים על הקיר בגובה הכתפיים. מורידים את החזה אל הקיר עם גוף ישר, ודוחפים חזרה.", "Push-Up": "ידיים מעט רחבות מהכתפיים, גוף ישר מהראש לעקבים. יורדים עד שהחזה כמעט נוגע ברצפה, מרפקים בזווית של כ-45° מהגוף, ודוחפים עד ידיים ישרות.", "Decline Push-Up": "שכיבת סמיכה עם רגליים מוגבהות על ספסל או ארגז. הגוף נשאר ישר, והעומס עובר יותר לחזה העליון ולכתפיים.", "Ring Push-Up": "הטבעות כמה סנטימטרים מעל הרצפה. ממנח שכיבת סמיכה יורדים עד שהחזה בין הטבעות, ודוחפים עד ידיים ישרות תוך סיבוב הטבעות החוצה.", "Archer Push-Up": "ידיים רחבות מאוד. יורדים לכיוון יד אחת שמתכופפת, והיד השנייה נשארת ישרה לצד ומייצבת. דוחפים חזרה ומחליפים צד.", "Pseudo Planche Push-Up": "ידיים ליד המותניים, אצבעות מסובבות החוצה או לאחור, והגוף מוטה קדימה כך שהכתפיים לפני כפות הידיים. יורדים ודוחפים בלי לאבד את ההטיה.", "Negative Dip": "מתחילים בתמיכה על המקבילים. יורדים לאט עד שהמרפקים בזווית של כ-90°, או לפי נוחות הכתף, ואז עולים חזרה בעזרת הרגליים.", "Band-Assisted Dip": "גומייה מתוחה בין המקבילים, והברכיים או כפות הרגליים נשענות עליה. יורדים עד כ-90° במרפק ודוחפים חזרה לתמיכה.", "Parallel Bar Dip": "מתמיכה על המקבילים יורדים עם גוף מעט נוטה קדימה, עד שהכתף מעט מתחת לגובה המרפק או לפי הטווח הנוח. דוחפים עד נעילת הידיים.", "Ring Support Hold": "עולים מעל הטבעות ונשענים עם ידיים ישרות ונעולות, טבעות צמודות לירכיים. מחזיקים כשהגוף מעט Hollow.", "Ring Dip": "מתמיכה על הטבעות יורדים כשהטבעות צמודות לגוף, עד שהכתף מתחת לגובה המרפק. דוחפים חזרה עד ידיים ישרות.", "Weighted Dip": "דיפס על מקבילים עם משקל נוסף בחגורה או באפוד. מתחילים רק אחרי שליטה מלאה בגרסה ללא משקל.", "Pike Push-Up": "ממנח Pike, כשהאגן גבוה, מכופפים מרפקים ומורידים את הראש לנקודה שלפני הידיים, כך שנוצר משולש. דוחפים חזרה עד ידיים ישרות.", "Elevated Pike Push-Up": "Pike Push-Up כשכפות הרגליים על ארגז, כך שהגו קרוב יותר לאנכי והעומס על הכתפיים גדל.", "Diamond Push-Up": "שכיבת סמיכה שבה הידיים צמודות מתחת לחזה, כשהאגודלים והאצבעות יוצרים צורת יהלום. המרפקים צמודים לגוף, וכך העומס עובר לתלת-ראשי.", "Reverse Crunch": "שוכבים על הגב, ברכיים כפופות למעלה. מגלגלים את האגן כלפי function rank(it){ const e = BYID[it.x]; if (!e || GORD[e.g]==null) return 9999; return GORD[e.g]*100; }
function sortDay(d){ if (!d) return; const a = d.items.map((it,i)=>[rank(it),i,it]); a.sort((x,y)=>x[0]-y[0]||x[1]-y[1]); d.items = a.map(x=>x[2]); }
const ADDTXT = {legs:"לרגליים",back:"לגב",chest:"לחזה",shoulders:"לכתפיים",arms:"לידיים",core:"לבטן ולליבה",full:"פונקציונלי",mob:"מוביליטי"};

const setsOf = it => { const n = parseInt(it.s, 10); return isNaN(n) ? 0 : n; };
function itemsHtml(d){
  // every body area is always listed (in order), even with no exercises yet
  const groups = GROUPS.map(G => ({g:G.k, rows:[]})), other = {g:"?", rows:[]};
  d.items.forEach((it,i) => { const e = BYID[it.x]; (groups.find(G => e && G.g === e.g) || other).rows.push([it,i]); });
  if (other.rows.length) groups.push(other);
  const allOpen = groups.every(G => OPEN.has(G.g));
  let html = `<li class="gall"><button type="button" class="mini" data-act="find">חיפוש תרגיל</button><button type="button" class="mini" data-act="gall">${allOpen ? "סגור הכל" : "פתח הכל"}</button></li>`;
  for (const G of groups){
    const meta = GROUPS.find(x => x.k === G.g), open = OPEN.has(G.g);
    const n = G.rows.length, sets = G.rows.reduce((a,[it]) => a + setsOf(it), 0);
    html += `<li class="gh${open?" open":""}"><button type="button" class="ghb" data-act="gtoggle" data-g="${G.g}" aria-expanded="${open}">
      <span class="ghn">${meta ? meta.he : "אחר"}</span><span class="ghm">${n ? `${n} ${n===1?"תרגיל":"תרגילים"}${sets?` · ${sets} סטים`:""}` : "0 תרגילים"}</span><span class="ghc" aria-hidden="true">⌄</span></button></li>`;
    if (open){ html += G.rows.length ? G.rows.map(([it,i]) => itemRow(it,i,d.items)).join("") : `<li class="gnone">עוד אין תרגילים באזור הזה ביום הזה.</li>`; html += addBtn(G.g); }
  }
  return html;
}

let toastT;
function toast(msg){ const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>{el.hidden = true;}, 2200); }

function makeItem(e){ const r = rx(e); return {x:e.id, he:e.he, s:r.s, r:r.r, w:"", i:"", rest:r.rest, n:""}; }
function toggle(id){
  const t = cur();
  if (!t){ if (sortedIds().length){ toast("בחרו קודם מתאמן למעלה"); window.scrollTo(0,0); return; } pendingAdd = id; openTrainee(); return; }
  const d = curDay(), e = BYID[id]; if (!e) return;
  const i = d.items.findIndex(it => it.x === id);
  if (i >= 0){ d.items.splice(i,1); toast(`${e.he} הוסר מ${d.name}`); }
  else { d.items.push(makeItem(e)); sortDay(d); if (!OPEN.has(e.g)){ OPEN.add(e.g); saveOpen(); } const G = GROUPS.find(x=>x.k===e.g); toast(`${e.he} נוסף ל${t.name} · ${d.name} · ${G?G.he:""}`); }
  save(activeId); renderTrainees(); renderLibrary(); renderPanel(); renderBar(); if (!$("picker").hidden) renderPicker();
}
function swap(i, dir){
  const d = curDay(), it = d.items[i], e = BYID[it.x]; if (!e) return;
  const used = new Set(d.items.map(x => x.x));
  const pool = EX.filter(c => c.g === e.g && c.sub === e.sub && !used.has(c.id) && (dir<0 ? c.lvl < e.lvl : c.lvl > e.lvl));
  if (!pool.length){ toast(dir<0 ? "אין תרגיל קל יותר באותה קטגוריה" : "אין תרגיל קשה יותר באותה קטגוריה"); return; }
  pool.sort((a,b) => Math.abs(a.lvl-e.lvl)-Math.abs(b.lvl-e.lvl) || (a.eq===e.eq?0:1)-(b.eq===e.eq?0:1) || (a.type===e.type?0:1)-(b.type===e.type?0:1));
  const n = pool[0];
  d.items[i] = {...makeItem(n), n: it.n};
  toast(`${e.he} ← ${n.he}`);
  save(activeId); renderLibrary(); renderPanel();
}

function setPlan(n){
  const t = cur(); if (!t || n === t.days.length){ closeModal(); return; }
  let moved = 0;
  if (n < t.days.length){
    const keep = t.days.slice(0, n), last = keep[keep.length-1];
    for (const d of t.days.slice(n)) for (const it of d.items){ if (!last.items.some(x => x.x === it.x)){ last.items.push(it); moved++; } }
    t.days = keep;
  } else while (t.days.length < n) t.days.push({id:uid(), name:"", items:[]});
  const names = planNames(n); t.days.forEach((d,i) => d.name = names[i]);
  activeDay = Math.min(activeDay, n-1); save(activeId); closeModal(); renderAll();
  toast(`סוג התוכנית: ${planLabel(t)}` + (moved ? `. ${moved===1?"תרגיל אחד הועבר":moved+" תרגילים הועברו"} ל${t.days[n-1].name}` : ""));
}

function exportBackup(){

  const a = document.createElement("a"), d = new Date();
  a.href = URL.createObjectURL(blob);

function importBackup(file){
  const r = new FileReader();
  r.onload = () => {
    let d; try { d = JSON.parse(r.result); } catch(e){ toast("הקובץ לא תקין"); return; }
    const tr = d && d.trainees && typeof d.trainees === "object" ? d.trainees : null;
    if (!tr){ toast("הקובץ לא תקין"); return; }
    let n = 0;
    for (const [id, t] of Object.entries(tr)){ if (t && t.name && Array.isArray(t.days)){ T[id] = t; save(id); n++; } }
    if (Array.isArray(d.custom) && d.custom.length){
      const have = new Set(CUSTOM.map(x => x.id));
      d.custom.forEach(x => { if (x && !have.has(x.id)) CUSTOM.push(x); });
      rebuild(); saveCustom();
    }
    closeModal(); renderAll(); toast(`יובאו ${n} מתאמנים`);
  };
  r.readAsText(file);
}

function programText(t){
  const lines = [`תוכנית אימון · ${t.name}`, [t.goal, t.level?LVL[t.level]:""].filter(Boolean).join(" · ")];
  if (t.notes) lines.push(t.notes);
  for (const d of t.days){
    sortDay(d);
    lines.push("", `▪ ${d.name}`);
    let lastG = null;
    if (!d.items.length) lines.push("(ריק)");
    d.items.forEach((it,i) => {
      const e = BYID[it.x] || {he:it.he||""};
      if (e.g && e.g !== lastG){ const G = GROUPS.find(x=>x.k===e.g); lines.push(`— ${G?G.he:""} —`); lastG = e.g; }
      let s = `${i+1}. ${e.he} · ${it.s}×${it.r}`;
      if (it.w) s += ` · ${it.w}${/^[\d.]+$/.test(it.w)?" ק\"ג":""}`;
      if (it.i) s += ` · עצימות ${it.i}`;
      if (it.rest && it.rest !== "0") s += ` · מנוחה ${it.rest} שנ'`;
      lines.push(s); if (it.n) lines.push(`   ${it.n}`);
    });
  }
  return lines.join("\n");
}

// ===================== program document (image / PDF) for sending on WhatsApp =====================
const DOC = {W:1240, pad:56, ink:"#18211F", muted:"#5B6866", line:"#D3DCDA", accent:"#1E6B78", soft:"#D6E8EA", chalk:"#F4F7F7"};
const DOC_COLS = [ // right → left
  {k:"ex", t:"תרגיל", w:0.27},
  {k:"s",  t:"סטים", w:0.08},
  {k:"r",  t:"חזרות", w:0.10},
  {k:"w",  t:"משקל", w:0.10},
  {k:"i",  t:"עצימות\n(RIR/RPE 1–10)", w:0.15},
  {k:"n",  t:"הערות", w:0.30},

const DOC_MIN = 4; // rows per body area: filled exercises first, then empty lines to write in
const planFull = t => t.days.length === 1 ? "פול באדי (אימון גוף מלא)" : "אימון מפוצל " + LET.slice(0, t.days.length);
function docRows(t){
  // per workout: body-area sections in the program order, only areas that have exercises
  return t.days.map(d => {
    sortDay(d);
    const secs = [];
    for (const G of GROUPS){
      const items = d.items.filter(it => (BYID[it.x]||{}).g === G.k);
      while (items.length < DOC_MIN) items.push(null);
      secs.push({title:G.he, items});
    }
    const other = d.items.filter(it => !BYID[it.x]);
    if (other.length) secs.push({title:"אחר", items:other});
    return {name:d.name, secs};
  });
}
function cellText(it, k){
  if (!it) return "";
  const e = BYID[it.x] || {he:it.he||""};
  if (k === "ex") return e.he;
  if (k === "w"){ const w = String(it.w||"").trim(); return w ? (/^[\d.,]+$/.test(w) ? w + " ק\"ג" : w) : "—"; }
  const v = String(it[k]||"").trim(); return v || (k === "n" ? "" : "—");
}
function wrapLines(ctx, text, maxW){
  const out = [];
  for (const para of String(text).split("\n")){
    const words = para.split(/\s+/).filter(Boolean); let line = "";
    if (!words.length){ out.push(""); continue; }

      if (ctx.measureText(test).width <= maxW || !line) line = test; else { out.push(line); line = w; }
    }
    out.push(line);
  }
  return out;
}
async function buildProgramCanvas(t){

  const FB = '"Assistant", system-ui, sans-serif', FD = '"Secular One", "Assistant", system-ui, sans-serif';

      for (const s of d.secs){ y += SECH; for (const it of s.items){ y += rowH(it); } }
      y += 36;
    }
    return y + 40;
  };
  const rowLines = (it) => colX.map(c => { ctx.font = (c.k === "ex" ? "700 " : "400 ") + "22px " + FB; return wrapLines(ctx, cellText(it, c.k), c.w - CP*2); });

  ctx.fillStyle = DOC.accent; ctx.fillRect(0, 0, W, 10);
  ctx.textAlign = "right"; ctx.fillStyle = DOC.ink; ctx.font = "400 52px " + FD; ctx.fillText("תוכנית אימונים", W - pad, pad);
  ctx.font = "700 26px " + FB; ctx.fillStyle = DOC.muted;
  const lab = (label, val, y) => { ctx.font = "700 26px " + FB; ctx.fillStyle = DOC.muted; ctx.fillText(label, W - pad, y); const lw = ctx.measureText(label + " ").width; ctx.font = "700 26px " + FB; ctx.fillStyle = DOC.ink; ctx.fillText(val, W - pad - lw, y); };
  lab("שם המתאמן/ת:", t.name, pad + 74);
  lab("סוג התוכנית:", planFull(t), pad + 110);
  let y = pad + 150;
  const hline = (yy, col, wdt) => { ctx.strokeStyle = col || DOC.line; ctx.lineWidth = wdt || 1.5; ctx.beginPath(); ctx.moveTo(pad, yy); ctx.lineTo(W - pad, yy); ctx.stroke(); };

    if (days.length > 1){ ctx.font = "400 34px " + FD; ctx.fillStyle = DOC.accent; ctx.textAlign = "right"; ctx.fillText(d.name, W - pad, y + 12); y += 58; }
    // column header
    ctx.fillStyle = DOC.accent; ctx.fillRect(pad, y, tw, HEADH);
    for (const c of colX){
      ctx.fillStyle = "#FFFFFF"; ctx.textAlign = "center";
      const parts = c.t.split("\n"); ctx.font = "700 21px " + FB;
      if (parts.length === 1) ctx.fillText(parts[0], c.right - c.w/2, y + HEADH/2 - 12);
      else { ctx.fillText(parts[0], c.right - c.w/2, y + 8); ctx.font = "400 17px " + FB; ctx.fillText(parts[1], c.right - c.w/2, y + 36); }
    }
    y += HEADH;
    for (const s of d.secs){
      ctx.fillStyle = DOC.soft; ctx.fillRect(pad, y, tw, SECH);
      ctx.fillStyle = DOC.accent; ctx.fillRect(W - pad - 6, y, 6, SECH);
      ctx.fillStyle = DOC.ink; ctx.font = "400 26px " + FD; ctx.textAlign = "right"; ctx.fillText(s.title, W - pad - CP - 6, y + 9);

}

  obj(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  obj(4, `<< /Type /XObject /Subtype /Image /Width ${imgW} /Height ${imgH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>`, jpegBytes);

    case "cancel": pendingAdd = null; closeModal(); break;
    case "info": case "open": openInfo(b.dataset.id); break;
    case "dadd": { const id = b.dataset.id; if (!cur()){ toggle(id); break; } toggle(id); const s2 = infoBtn(id); const db2 = $("dbtn"); if (db2){ db2.textContent = s2.txt; db2.classList.toggle("on", s2.on); } $("dtgt") && ($("dtgt").textContent = s2.tgt); break; }
    case "grp": F.g = b.dataset.g; F.sub = "all"; F.q = ""; $("q").value = ""; F.q2 = ""; $("q2").value = ""; $("q2clear").hidden = true; F.type.clear(); F.eq.clear(); renderLibrary(); break;
    case "sub": F.sub = b.dataset.s; renderLibrary(); break;
    case "f": { const k = b.dataset.k, v = k==="lvl" ? +b.dataset.v : b.dataset.v; F[k].has(v) ? F[k].delete(v) : F[k].add(v); renderLibrary(); break; }
    case "ftog": { const open = $("fbody").hidden; $("fbody").hidden = !open; b.setAttribute("aria-expanded", open); break; }
    case "clearF": F.lvl.clear(); F.type.clear(); F.eq.clear(); renderLibrary(); break;
    case "toggle": toggle(b.dataset.id); break;
    case "day": activeDay = +b.dataset.i; renderLibrary(); renderPanel(); renderBar(); break;
    case "ttype": openPlan(); break;
    case "plan": planPick = +b.dataset.n; $("mbox").innerHTML = planBody(); break;
    case "planok": setPlan(planPick); break;
    case "addDay": t.days.push({id:uid(), name:`אימון ${String.fromCharCode(65 + t.days.length)}`, items:[]}); activeDay = t.days.length-1; save(activeId); renderAll(); break;
    case "delDay": if (armed !== "day"){ armed = "day"; renderPanel(); return; } t.days.splice(activeDay,1); activeDay = Math.max(0,activeDay-1); armed = null; save(activeId); renderAll(); break;
    case "rm": { const d = curDay(); d.items.splice(+b.dataset.i,1); save(activeId); renderTrainees(); renderLibrary(); renderPanel(); renderBar(); break; }
    case "up": case "down": { const d = curDay(), i = +b.dataset.i, j = a==="up"?i-1:i+1; [d.items[i], d.items[j]] = [d.items[j], d.items[i]]; save(activeId); renderPanel(); break; }
    case "easier": swap(+b.dataset.i, -1); break;
    case "harder": swap(+b.dataset.i, 1); break;
    case "copy": copyProgram(); break;
    case "send": openSend(); break;
    case "savepng": saveDoc("png", b.dataset.n); break;
    case "savepdf": saveDoc("pdf", b.dataset.n); break;
    case "sharepng": shareDoc("png"); break;
    case "sharepdf": shareDoc("pdf"); break;
    case "dlpng": downloadDoc("png"); break;
    case "dlpdf": downloadDoc("pdf"); break;
    case "dup": { const id = uid(), c = JSON.parse(JSON.stringify(t)); c.name = t.name + " (עותק)"; c.created = Date.now(); c.days.forEach(d => d.id = uid()); T[id] = c; activeId = id; activeDay = 0; save(id); renderAll(); openTrainee(true); toast("התוכנית שוכפלה. תנו שם למתאמן החדש"); break; }
    case "delT": { if (armed !== "t"){ armed = "t"; renderPanel(); return; } const name = t.name; delete T[activeId]; save(activeId); activeId = null; armed = null; pickActive(); renderAll(); toast(`${name} נמחק`); break; }
    case "close": $("panel").classList.remove("open"); activeId = null; activeDay = 0; setAdding(false); renderAll(); break;
    case "gtoggle": { const g = b.dataset.g; OPEN.has(g) ? OPEN.delete(g) : OPEN.add(g); saveOpen(); renderPanel(); break; }
    case "gall": { const d = curDay(), gs = GROUPS.map(G => G.k); if (d && d.items.some(it => { const e = BYID[it.x]; return !e || !gs.includes(e.g); })) gs.push("?"); const all = gs.every(g => OPEN.has(g));
      gs.forEach(g => all ? OPEN.delete(g) : OPEN.add(g)); saveOpen(); renderPanel(); break; }
    case "addgrp": openPicker(b.dataset.g); break;
    case "pkclose": closePicker(); break;
    case "pksub": PK.sub = b.dataset.s; renderPicker(); $("pklist").scrollTop = 0; break;
    case "addgrp_old": { F.g = b.dataset.g; F.sub = "all"; F.q = ""; $("q").value = ""; $("qclear").hidden = true; F.q2 = ""; $("q2").value = ""; $("q2clear").hidden = true; F.type.clear(); F.eq.clear();
      $("panel").classList.remove("open"); renderLibrary(); const el = $("groups"); window.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + window.scrollY - 80));
      const G = GROUPS.find(x=>x.k===F.g); toast(`מציג תרגילי ${G?G.he:""}. אפשר לחפש בתוך ${G?G.he:"הקטגוריה"} או ללחוץ +`); break; }
    case "find": { setAdding(true); $("panel").classList.remove("open"); const q = $("q"); q.readOnly = false; q.focus(); window.scrollTo(0, 0); break; }
    case "backprog": setAdding(false); if (cur()) $("panel").classList.add("open"); break;
  }
  if (armed === null && (a==="delT"||a==="delDay")) {}
});
$("barBtn").addEventListener("click", () => { if (cur()){ setAdding(false); $("panel").classList.add("open"); } });
// "adding" view: opened from a trainee's program to look for exercises — no app title or trainee list, just a strip saying whose program it is
function setAdding(on){
  const t = cur(); on = on && !!t;
  document.body.classList.toggle("adding", on); $("addbar").hidden = !on;
  if (on){ const d = curDay(); $("addname").textContent = t.name + (t.days.length > 1 ? " · " + d.name : ""); }
}
$("newEx").addEventListener("click", openCustom);
document.addEventListener("keydown", ev => { if (ev.key === "Escape"){ if (!$("modal").hidden) closeModal(); else if (!$("picker").hidden) closePicker(); else $("panel").classList.remove("open"); } });
let qT;
$("q").addEventListener("input", ev => { $("qclear").hidden = !ev.target.value; clearTimeout(qT); qT = setTimeout(() => { F.q = ev.target.value; renderLibrary(); }, 120); });
$("q").addEventListener("keydown", ev => { if (ev.key === "Enter") ev.target.blur(); });
let q2T;
$("q2").addEventListener("input", ev => { $("q2clear").hidden = !ev.target.value; clearTimeout(q2T); q2T = setTimeout(() => { F.q2 = ev.target.value; renderLibrary(); }, 120); });
$("q2").addEventListener("keydown", ev => { if (ev.key === "Enter") ev.target.blur(); });
$("q2clear").addEventListener("click", () => { $("q2").value = ""; F.q2 = ""; $("q2clear").hidden = true; renderLibrary(); });
let pkT;
$("pkq").addEventListener("input", ev => { $("pkqclear").hidden = !ev.target.value; clearTimeout(pkT); pkT = setTimeout(() => { PK.q = ev.target.value; renderPicker(); }, 120); });
$("pkq").addEventListener("keydown", ev => { if (ev.key === "Enter") ev.target.blur(); });
$("pkqclear").addEventListener("click", () => { $("pkq").value = ""; PK.q = ""; $("pkqclear").hidden = true; renderPicker(); });
$("qclear").addEventListener("click", () => { const q = $("q"); q.value = ""; F.q = ""; $("qclear").hidden = true; renderLibrary(); });
$("panel").addEventListener("input", ev => {
  const el = ev.target, t = cur(); if (!t) return;
  if (el.id === "dayName"){ curDay().name = el.value; save(activeId); renderBar(); $("target").querySelectorAll("b")[1] && ($("target").querySelectorAll("b")[1].textContent = el.value); return; }
  if (el.dataset.f){ const it = curDay().items[+el.dataset.i]; if (it){ it[el.dataset.f] = el.value; save(activeId); } }
});
$("panel").addEventListener("change", ev => { if (ev.target.id === "dayName") renderPanel(); });
// Apple Pencil guard: every text field is locked until it is deliberately tapped, so a pen dragged across the
// screen to scroll never starts handwriting. A finger touch unlocks the field before the browser focuses it
// (the keyboard opens as usual); a short pen tap unlocks it on the click and focuses it again to open the keyboard.
const EDIT = 'input:not([type=checkbox]):not([type=radio]):not([type=button]):not([type=submit]),textarea';
// search boxes and fields inside pop-up windows are never locked, so the keyboard always opens on the first tap
const NOLOCK = el => el.type === "search" || !!el.closest("#modal");
// tapping a search box that already has the keyboard open closes the keyboard
let srchWasFocused = null;
document.addEventListener("pointerdown", ev => { const el = ev.target.closest && ev.target.closest("input[type=search]"); srchWasFocused = el && document.activeElement === el ? el : null; }, true);
document.addEventListener("click", ev => { const el = ev.target.closest && ev.target.closest("input[type=search]"); if (el && srchWasFocused === el){ el.blur(); } srchWasFocused = null; }, true);
function lockAll(){ document.querySelectorAll(EDIT).forEach(el => { if (!el.dataset.lk && !NOLOCK(el)){ el.dataset.lk = "1"; if (document.activeElement !== el) el.readOnly = true; } }); }
new MutationObserver(lockAll).observe(document.body, {childList:true, subtree:true});
lockAll();
let pen = null, lastPtr = 0;
const relock = el => setTimeout(() => { if (document.activeElement !== el) el.readOnly = true; }, 700);
document.addEventListener("pointerdown", ev => {
  lastPtr = Date.now();
  const el = ev.target.closest && ev.target.closest(EDIT);
  if (!el || !el.dataset.lk) return;
  if (ev.pointerType === "pen"){ pen = {el, x:ev.clientX, y:ev.clientY, t:Date.now(), tap:false}; }
  else { el.readOnly = false; relock(el); }
}, true);
document.addEventListener("pointerup", ev => {
  if (!pen) return;
  pen.tap = Math.hypot(ev.clientX-pen.x, ev.clientY-pen.y) < 14 && Date.now()-pen.t < 700;
  if (!pen.tap) pen = null;
}, true);
document.addEventListener("pointercancel", () => { pen = null; }, true);
document.addEventListener("click", ev => {
  const el = ev.target.closest && ev.target.closest(EDIT);
  if (!el || !el.dataset.lk) return;
  if (el.readOnly && (!pen || pen.tap)){ el.readOnly = false; el.blur(); el.focus(); }
  pen = null;
}, true);
document.addEventListener("focusin", ev => { const el = ev.target; if (el.dataset && el.dataset.lk && Date.now()-lastPtr > 800) el.readOnly = false; }, true);
document.addEventListener("focusout", ev => { const el = ev.target; if (el.dataset && el.dataset.lk) el.readOnly = true; }, true);


renderAll();
</script>
